<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link</title>
  <meta name="description" content="Link: red gremial online para noticias, empleo, marketplace y mensajes.">
  <link rel="preload" href="/logolink.png" as="image">
  <style>
    :root{--black:#000;--graphite:#1c1c1e;--graphite2:#2c2c2e;--line:#3a3a3c;--gold:#d4af37;--blue:#007aff;--green:#34c759;--red:#ff3b30;--text:#fff;--muted:#a0a0a6;--muted2:#73737a}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#060606;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .site-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 12%,rgba(212,175,55,.16),transparent 30%),linear-gradient(135deg,#050505,#171717 52%,#211b12)}
    .phone{width:min(100%,430px);height:min(860px,calc(100vh - 48px));min-height:690px;overflow:hidden;display:grid;grid-template-rows:34px 1fr 74px;background:var(--black);border:1px solid var(--line);border-radius:32px;box-shadow:0 26px 80px rgba(0,0,0,.42)}
    .status{display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:#f2f2f7;font-size:12px;font-weight:800;background:var(--black)}
    .status span:last-child{color:var(--muted)}
    #content{min-height:0;overflow:hidden}
    .screen{height:100%;overflow-y:auto;padding:8px 16px 24px;scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .head{position:sticky;top:0;z-index:2;padding:10px 0 14px;background:linear-gradient(180deg,#000 76%,rgba(0,0,0,0))}
    .brand{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}
    .logo{width:54px;height:54px;object-fit:contain;border-radius:13px;background:#000;box-shadow:0 0 0 1px rgba(212,175,55,.24),0 10px 24px rgba(212,175,55,.12)}
    .head span{display:block;margin-bottom:2px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0}
    .head h1{margin:0;color:#fff;font-size:32px;line-height:1;font-weight:900}
    .head h1.gold{color:var(--gold)}
    .notice{margin:0 0 12px;padding:10px 12px;color:#f5e9bf;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.22);border-radius:12px;font-size:12px;line-height:1.35}
    .panel,.card,.chat{background:var(--graphite);border:1px solid rgba(255,255,255,.07);border-radius:14px}
    .panel{padding:12px;margin-bottom:14px}
    .panel h2{margin:0 0 10px;font-size:15px}
    .grid-form{display:grid;gap:9px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    input,textarea,select{width:100%;min-width:0;color:#fff;background:var(--graphite2);border:1px solid rgba(255,255,255,.08);border-radius:10px;outline:0;padding:10px 11px}
    textarea{min-height:82px;resize:vertical}
    input::placeholder,textarea::placeholder{color:var(--muted2)}
    .submit{height:40px;color:#160f03;background:var(--gold);border:0;border-radius:11px;font-weight:900}
    .secondary{height:36px;color:#fff;background:var(--graphite2);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-weight:800}
    .stack{display:grid;gap:10px}
    .empty{padding:18px 14px;color:var(--muted);background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.14);border-radius:14px;text-align:center;font-size:13px}
    .card{padding:14px}
    .topline{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:800}
    .topline strong{color:var(--gold);white-space:nowrap}
    h3{margin:0;color:#fff;font-size:16px;line-height:1.2}
    .card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .pill{display:inline-flex;align-items:center;min-height:22px;padding:3px 7px;color:#f6e8ba;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.18);border-radius:7px;font-size:11px;font-weight:800}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .product{overflow:hidden;padding:0}
    .product .photo{height:92px;display:grid;place-items:center;background:var(--graphite2);color:var(--muted2);font-size:12px;font-weight:900}
    .product .body{padding:10px}
    .product h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .price{display:block;margin-top:4px;color:var(--gold);font-size:13px;font-weight:900}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:7px 8px 12px;background:rgba(28,28,30,.98);border-top:1px solid var(--graphite2)}
    .tab{display:grid;justify-items:center;gap:3px;min-width:0;color:var(--muted);background:transparent;border:0}
    .tab span{width:28px;height:28px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;font-size:12px;font-weight:900}
    .tab small{max-width:100%;overflow:hidden;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
    .tab.active{color:var(--gold)}
    .threads{display:grid;gap:8px;margin-bottom:12px}
    .thread{width:100%;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;padding:10px;color:#fff;background:var(--graphite);border:1px solid rgba(255,255,255,.07);border-radius:12px;text-align:left}
    .thread.active{border-color:rgba(212,175,55,.48)}
    .avatar{width:42px;height:42px;display:grid;place-items:center;color:var(--gold);background:var(--graphite2);border-radius:50%;font-size:16px;font-weight:900}
    .thread strong,.thread small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .thread small{margin-top:3px;color:var(--muted);font-size:12px}
    .chat{padding:12px}
    .bubble-stack{display:grid;gap:8px;margin-bottom:10px}
    .bubble{max-width:86%;justify-self:start;padding:9px 11px;background:var(--graphite2);border-radius:13px}
    .bubble.mine{justify-self:end;background:var(--blue)}
    .bubble strong{display:block;margin-bottom:3px;color:rgba(255,255,255,.76);font-size:10px}
    .bubble p{margin:0;font-size:13px;line-height:1.32}
    .inline-form{display:grid;grid-template-columns:1fr auto;gap:8px}
    .error{display:none;margin:0 0 10px;padding:9px 10px;color:#ffd7d4;background:rgba(255,59,48,.12);border:1px solid rgba(255,59,48,.22);border-radius:10px;font-size:12px}
    .error.show{display:block}
    @media (max-width:520px){.site-shell{padding:0;background:#000}.phone{width:100%;height:100vh;min-height:100vh;border:0;border-radius:0}.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="site-shell">
    <section class="phone" aria-label="Link">
      <header class="status"><span>9:41</span><span>Online</span></header>
      <div id="content"></div>
      <nav class="tabs" aria-label="Navegacion principal"></nav>
    </section>
  </main>
  <script>
    const api = {
      async state() {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) throw new Error("No se pudo cargar");
        return res.json();
      },
      async post(path, payload) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "No se pudo guardar");
        return data;
      },
    };

    const tabs = [
      ["inicio", "Inicio", "N"],
      ["empleos", "Empleos", "E"],
      ["marketplace", "Market", "M"],
      ["mensajes", "Mensajes", "C"],
    ];

    let active = "inicio";
    let activeThreadId = "";
    let state = { news: [], jobs: [], products: [], threads: [] };
    const content = document.querySelector("#content");
    const nav = document.querySelector(".tabs");

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
    }

    function dateLabel(value) {
      if (!value) return "";
      return new Date(value).toLocaleDateString("es-CO", { day: "2-digit", month: "short" });
    }

    function header(eyebrow, title, gold = false) {
      return `<div class="head"><div class="brand"><img class="logo" src="/logolink.png" alt="Logo Link"><div><span>${esc(eyebrow)}</span><h1 class="${gold ? "gold" : ""}">${esc(title)}</h1></div></div></div>`;
    }

    function renderTabs() {
      nav.innerHTML = tabs.map((tab) => `<button class="tab ${active === tab[0] ? "active" : ""}" data-tab="${tab[0]}"><span>${tab[2]}</span><small>${tab[1]}</small></button>`).join("");
      nav.querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          active = button.dataset.tab;
          render();
        };
      });
    }

    function formError(message = "") {
      return `<p class="error ${message ? "show" : ""}" id="formError">${esc(message)}</p>`;
    }

    function empty(text) {
      return `<div class="empty">${esc(text)}</div>`;
    }

    function renderInicio() {
      const list = state.news.length ? state.news.map((item) => `
        <article class="card">
          <div class="topline"><span>${esc(item.category)}</span><strong>${esc(dateLabel(item.createdAt))}</strong></div>
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.body)}</p>
          <div class="meta">${item.contact ? `<span class="pill">${esc(item.contact)}</span>` : ""}</div>
        </article>`).join("") : empty("No hay alertas publicadas.");
      return `<section class="screen">${header("Link", "Radar Gremial", true)}
        ${formError()}
        <form class="panel grid-form" data-action="/api/news">
          <h2>Publicar alerta</h2>
          <input name="title" placeholder="Titulo" required>
          <div class="split">
            <input name="category" placeholder="Categoria">
            <input name="contact" placeholder="Contacto">
          </div>
          <textarea name="body" placeholder="Contenido" required></textarea>
          <button class="submit" type="submit">Guardar</button>
        </form>
        <div class="stack">${list}</div>
      </section>`;
    }

    function renderEmpleos() {
      const list = state.jobs.length ? state.jobs.map((item) => `
        <article class="card">
          <div class="topline"><span>${esc(item.city || "Sin ciudad")}</span><strong>${esc(dateLabel(item.createdAt))}</strong></div>
          <h3>${esc(item.name)}</h3>
          <p><strong>${esc(item.role)}</strong></p>
          <p>${esc(item.specialty || "")}</p>
          <div class="meta">${item.contact ? `<span class="pill">${esc(item.contact)}</span>` : ""}</div>
        </article>`).join("") : empty("No hay perfiles o vacantes publicados.");
      return `<section class="screen">${header("Bolsa", "Talento Gaming")}
        ${formError()}
        <form class="panel grid-form" data-action="/api/jobs">
          <h2>Publicar perfil</h2>
          <input name="name" placeholder="Nombre o empresa" required>
          <input name="role" placeholder="Cargo o necesidad" required>
          <div class="split">
            <input name="city" placeholder="Ciudad">
            <input name="contact" placeholder="Contacto">
          </div>
          <textarea name="specialty" placeholder="Experiencia, requisitos o especialidad"></textarea>
          <button class="submit" type="submit">Guardar</button>
        </form>
        <div class="stack">${list}</div>
      </section>`;
    }

    function renderMarketplace() {
      const list = state.products.length ? state.products.map((item) => `
        <article class="card product">
          <div class="photo">LINK</div>
          <div class="body">
            <h3>${esc(item.name)}</h3>
            <strong class="price">${esc(item.price)}</strong>
            <p>${esc(item.description || "")}</p>
            <div class="meta"><span class="pill">${esc(item.condition)}</span>${item.contact ? `<span class="pill">${esc(item.contact)}</span>` : ""}</div>
          </div>
        </article>`).join("") : empty("No hay productos publicados.");
      return `<section class="screen">${header("Clasificados", "Marketplace")}
        ${formError()}
        <form class="panel grid-form" data-action="/api/products">
          <h2>Publicar producto</h2>
          <input name="name" placeholder="Producto" required>
          <div class="split">
            <input name="price" placeholder="Precio" required>
            <select name="condition">
              <option>Nueva</option>
              <option>Usado</option>
              <option>Para piezas</option>
              <option>Disponible</option>
            </select>
          </div>
          <input name="contact" placeholder="Contacto">
          <textarea name="description" placeholder="Descripcion"></textarea>
          <button class="submit" type="submit">Guardar</button>
        </form>
        <div class="product-grid">${list}</div>
      </section>`;
    }

    function renderMensajes() {
      const activeThread = state.threads.find((thread) => thread.id === activeThreadId) || state.threads[0];
      if (activeThread && activeThread.id !== activeThreadId) activeThreadId = activeThread.id;
      const threads = state.threads.length ? state.threads.map((thread) => `
        <button class="thread ${thread.id === activeThreadId ? "active" : ""}" data-thread="${esc(thread.id)}">
          <div class="avatar">${esc(thread.name[0] || "L")}</div>
          <div><strong>${esc(thread.name)}</strong><small>${esc(thread.topic)}</small></div>
        </button>`).join("") : empty("No hay conversaciones.");
      const chat = activeThread ? `
        <div class="chat">
          <div class="bubble-stack">
            ${(activeThread.messages || []).map((message) => `<div class="bubble ${message.author === "Link" ? "mine" : ""}"><strong>${esc(message.author)}</strong><p>${esc(message.text)}</p></div>`).join("")}
          </div>
          <form class="inline-form" data-message="${esc(activeThread.id)}">
            <input name="message" placeholder="Mensaje" required>
            <button class="secondary" type="submit">Enviar</button>
          </form>
        </div>` : "";
      return `<section class="screen">${header("Chat", "Mensajes")}
        ${formError()}
        <form class="panel grid-form" data-action="/api/threads">
          <h2>Nueva conversacion</h2>
          <div class="split">
            <input name="name" placeholder="Nombre" required>
            <input name="topic" placeholder="Tema">
          </div>
          <textarea name="message" placeholder="Mensaje inicial" required></textarea>
          <button class="submit" type="submit">Guardar</button>
        </form>
        <div class="threads">${threads}</div>
        ${chat}
      </section>`;
    }

    function bindForms() {
      document.querySelectorAll("form[data-action]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await submitForm(form.dataset.action, form);
        };
      });
      document.querySelectorAll("form[data-message]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          const payload = Object.fromEntries(new FormData(form).entries());
          await save(`/api/threads/${form.dataset.message}/messages`, payload);
        };
      });
      document.querySelectorAll(".thread[data-thread]").forEach((button) => {
        button.onclick = () => {
          activeThreadId = button.dataset.thread;
          render();
        };
      });
    }

    async function submitForm(path, form) {
      const payload = Object.fromEntries(new FormData(form).entries());
      await save(path, payload);
    }

    async function save(path, payload) {
      try {
        await api.post(path, payload);
        state = await api.state();
        render();
      } catch (error) {
        const box = document.querySelector("#formError");
        if (box) {
          box.textContent = error.message;
          box.classList.add("show");
        }
      }
    }

    function render() {
      renderTabs();
      if (active === "inicio") content.innerHTML = renderInicio();
      if (active === "empleos") content.innerHTML = renderEmpleos();
      if (active === "marketplace") content.innerHTML = renderMarketplace();
      if (active === "mensajes") content.innerHTML = renderMensajes();
      bindForms();
    }

    async function boot() {
      renderTabs();
      content.innerHTML = `<section class="screen">${header("Link", "Cargando", true)}${empty("Cargando datos...")}</section>`;
      try {
        state = await api.state();
      } catch {
        state = { news: [], jobs: [], products: [], threads: [] };
      }
      render();
    }

    boot();
  </script>
</body>
</html>
