<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Link</title>
  <meta name="description" content="Link: aplicacion online para informacion oficial, bolsa de empleo, mercado y mensajes del sector.">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Link">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preload" href="/logolink.png" as="image">
  <style>
    :root{--bg:#050505;--panel:#111112;--panel2:#181819;--field:#202022;--line:#2a2926;--line2:#3a3425;--gold:#caa64c;--gold2:#f0d27a;--text:#f7f3ea;--muted:#aaa39a;--muted2:#77736d;--blue:#6aa7ff;--green:#47c97a;--red:#ff6b61;--shadow:0 20px 70px rgba(0,0,0,.45)}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .stage{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(160deg,#050505 0%,#0b0b0b 58%,#17130a 100%)}
    .app{width:min(100%,430px);height:min(860px,calc(100vh - 44px));min-height:690px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;background:#050505;border:1px solid #2b2b2b;border-radius:32px;box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;color:#eee7d8;font-size:12px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.04)}
    .topbar small{color:var(--gold2);font-weight:900}
    #content{min-height:0;overflow:hidden}
    .screen{height:100%;overflow-y:auto;padding:16px 18px 22px;scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .splash{height:100%;display:grid;align-content:center;justify-items:center;padding:34px;text-align:center}
    .logo-hero{width:148px;height:148px;margin-bottom:20px;background:url("/logolink.png") center/contain no-repeat;border-radius:28px;filter:drop-shadow(0 18px 34px rgba(202,166,76,.18))}
    .splash h1{margin:0;color:var(--gold2);font-size:38px;line-height:1;font-weight:900}
    .splash p{max-width:260px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
    .splash-news{width:100%;max-width:300px;margin-top:18px;padding:12px 14px;background:#101010;border:1px solid rgba(202,166,76,.2);border-radius:16px;text-align:left}
    .splash-news strong,.splash-news span{display:block}
    .splash-news strong{color:var(--gold2);font-size:12px;text-transform:uppercase}
    .splash-news span{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}
    .loader{width:118px;height:3px;overflow:hidden;margin-top:24px;background:#1d1d1d;border-radius:999px}
    .loader::after{content:"";display:block;width:44%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;animation:load 1.2s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    .hero{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;margin-bottom:14px}
    .logo-card{width:86px;height:86px;background:#030303 url("/logolink.png") center/contain no-repeat;border:1px solid rgba(202,166,76,.34);border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
    .hero-kicker{margin:0 0 3px;color:var(--gold2);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0}
    .hero h1{margin:0;color:var(--text);font-size:29px;line-height:1.03;font-weight:900}
    .hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.34}
    .install-card,.account-card,.locked{display:grid;gap:10px;margin-bottom:14px;padding:12px;background:linear-gradient(180deg,#151411,#0e0e0e);border:1px solid rgba(202,166,76,.18);border-radius:16px}
    .install-card{grid-template-columns:1fr auto;align-items:center}
    .install-card strong,.account-card strong,.locked strong{display:block;font-size:13px}
    .install-card span,.account-card span,.locked span{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35}
    .install-btn,.primary,.secondary{min-height:40px;padding:0 14px;border:0;border-radius:12px;font-weight:900}
    .install-btn,.primary{color:#171105;background:linear-gradient(180deg,var(--gold2),var(--gold))}
    .secondary{color:var(--text);background:#202020;border:1px solid #373737}
    .install-help{display:none;margin:-6px 0 14px;padding:10px 12px;color:#e9dbc0;background:rgba(202,166,76,.08);border:1px solid rgba(202,166,76,.18);border-radius:12px;font-size:12px;line-height:1.35}
    .install-help.show{display:block}
    .official-strip{display:grid;gap:9px;margin:-2px 0 14px;padding:12px;background:#0c0c0c;border:1px solid rgba(202,166,76,.2);border-radius:16px}
    .official-strip-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .official-strip-head strong{color:var(--gold2);font-size:12px;text-transform:uppercase}
    .official-strip-head span{color:var(--muted2);font-size:11px;font-weight:800}
    .official-links{display:grid;gap:7px}
    .official-link{display:grid;gap:2px;padding:9px 10px;color:inherit;text-decoration:none;background:#151515;border:1px solid rgba(255,255,255,.06);border-radius:12px}
    .official-link strong{color:var(--gold2);font-size:11px}
    .official-link span{overflow:hidden;color:var(--text);font-size:12px;font-weight:800;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
    .official-list{display:grid;gap:10px;margin-bottom:14px}
    .source-card{display:block;padding:14px;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .source-card:focus,.source-card:hover{border-color:rgba(202,166,76,.48)}
    .source-card h3{margin:0;color:var(--text);font-size:15px;line-height:1.25}
    .source-card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.38}
    .origin-link,.text-link{display:inline-flex;margin-top:10px;color:var(--gold2);font-size:12px;font-weight:900;text-decoration:none}
    details.editor{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    details.editor summary{list-style:none;padding:14px 14px;color:var(--text);font-size:14px;font-weight:900}
    details.editor summary::-webkit-details-marker{display:none}
    details.editor[open] summary{border-bottom:1px solid var(--line)}
    .form{display:grid;gap:10px;padding:12px 14px 14px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input,textarea,select{width:100%;min-width:0;color:var(--text);background:var(--field);border:1px solid #343436;border-radius:12px;outline:0;padding:11px 12px}
    input[type="file"]{padding:9px 10px;color:var(--muted);font-size:12px}
    textarea{min-height:92px;resize:vertical}
    input:focus,textarea:focus,select:focus{border-color:rgba(202,166,76,.58);box-shadow:0 0 0 3px rgba(202,166,76,.1)}
    input::placeholder,textarea::placeholder{color:var(--muted2)}
    .error{display:none;margin:0 0 12px;padding:10px 12px;color:#ffd9d5;background:rgba(255,107,97,.12);border:1px solid rgba(255,107,97,.22);border-radius:12px;font-size:12px}
    .error.show{display:block}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:8px 0 10px}
    .section-title h2{margin:0;font-size:16px}
    .section-title small{color:var(--muted2);font-size:12px;font-weight:800}
    .stack{display:grid;gap:10px}
    .empty{display:grid;place-items:center;min-height:110px;padding:18px 14px;color:var(--muted);background:#080808;border:1px dashed #2e2e2e;border-radius:16px;text-align:center;font-size:13px;line-height:1.35}
    .card{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .topline{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:900}
    .topline strong{color:var(--gold2);white-space:nowrap}
    .card h3{margin:0;color:var(--text);font-size:16px;line-height:1.22}
    .card p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.38;white-space:pre-line}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .pill{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;color:#f2ddaa;background:rgba(202,166,76,.1);border:1px solid rgba(202,166,76,.18);border-radius:8px;font-size:11px;font-weight:900}
    .auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .profile-row{display:grid;grid-template-columns:54px 1fr;gap:11px;align-items:center}
    .profile-photo{width:54px;height:62px;display:grid;place-items:center;overflow:hidden;background:#080808;border:1px solid rgba(202,166,76,.2);border-radius:12px;color:var(--gold2);font-weight:900}
    .profile-photo img{width:100%;height:100%;object-fit:cover}
    .resume-card{display:grid;gap:12px}
    .action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .mini-btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;color:#171105;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:10px;font-size:12px;font-weight:900;text-decoration:none}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .product{overflow:hidden;padding:0}
    .product-logo{height:104px;background:#070707 url("/logolink.png") center/64px no-repeat;border-bottom:1px solid var(--line)}
    .product-body{padding:11px}
    .product h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .price{display:block;margin-top:4px;color:var(--gold2);font-size:13px;font-weight:900}
    .threads{display:grid;gap:8px;margin-bottom:12px}
    .thread{width:100%;display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;padding:10px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:left}
    .thread.active{border-color:rgba(202,166,76,.52);background:#15130e}
    .avatar{width:42px;height:42px;display:grid;place-items:center;color:#191204;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:50%;font-size:16px;font-weight:900}
    .thread strong,.thread small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .thread small{margin-top:3px;color:var(--muted);font-size:12px}
    .chat{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .bubble-stack{display:grid;gap:8px;margin-bottom:10px}
    .bubble{max-width:86%;justify-self:start;padding:9px 11px;background:var(--field);border-radius:14px}
    .bubble.mine{justify-self:end;color:#161005;background:linear-gradient(180deg,var(--gold2),var(--gold))}
    .bubble strong{display:block;margin-bottom:3px;color:inherit;opacity:.75;font-size:10px}
    .bubble p{margin:0;font-size:13px;line-height:1.32}
    .inline-form{display:grid;grid-template-columns:1fr auto;gap:8px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:8px 8px 12px;background:#101010;border-top:1px solid #272727}
    .tab{display:grid;justify-items:center;gap:4px;min-width:0;color:#9f9b93;background:transparent;border:0}
    .tab i{width:22px;height:22px;display:block;position:relative}
    .tab i::before,.tab i::after{content:"";position:absolute;inset:4px;border:1.8px solid currentColor;border-radius:5px}
    .tab[data-tab="empleos"] i::before{border-radius:50% 50% 44% 44%}
    .tab[data-tab="marketplace"] i::before{inset:5px 3px 4px;border-radius:4px}
    .tab[data-tab="mensajes"] i::before{border-radius:8px}
    .tab[data-tab="mensajes"] i::after{inset:auto 4px 2px auto;width:6px;height:6px;border-width:0 1.8px 1.8px 0;border-radius:0;transform:rotate(35deg)}
    .tab small{max-width:100%;overflow:hidden;font-size:11px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
    .tab.active{color:var(--gold2)}
    @media (max-width:520px){.stage{padding:0;background:#050505}.app{width:100%;height:100vh;min-height:100vh;border:0;border-radius:0}.screen{padding-left:16px;padding-right:16px}.split,.auth-grid{grid-template-columns:1fr}.hero{grid-template-columns:76px 1fr}.logo-card{width:76px;height:76px}.hero h1{font-size:27px}.product-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="app" aria-label="Link">
      <header class="topbar"><span>9:41</span><small>LINK ONLINE</small></header>
      <div id="content"></div>
      <nav class="tabs" aria-label="Navegacion principal"></nav>
    </section>
  </main>
  <script>
    const authKey = "linkSessionToken";
    let sessionToken = localStorage.getItem(authKey) || "";

    const api = {
      headers() {
        return {
          "content-type": "application/json",
          ...(sessionToken ? { authorization: `Bearer ${sessionToken}` } : {}),
        };
      },
      async state() {
        const res = await fetch("/api/state", { cache: "no-store", headers: sessionToken ? { authorization: `Bearer ${sessionToken}` } : {} });
        if (!res.ok) throw new Error("No se pudo cargar la informacion");
        return res.json();
      },
      async officialNews(refresh = false) {
        const res = await fetch(`/api/official-news${refresh ? "?refresh=1" : ""}`, { cache: "no-store" });
        if (!res.ok) throw new Error("No se pudo consultar el servidor de noticias oficiales");
        return res.json();
      },
      async post(path, payload) {
        const res = await fetch(path, {
          method: "POST",
          headers: this.headers(),
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "No se pudo guardar");
        return data;
      },
    };

    const tabs = [
      ["inicio", "Al Dia"],
      ["empleos", "Bolsa"],
      ["marketplace", "Mercado"],
      ["mensajes", "Mensajes"],
    ];

    let active = "inicio";
    let activeThreadId = "";
    let installPromptEvent = null;
    let state = baseState();
    const content = document.querySelector("#content");
    const nav = document.querySelector(".tabs");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPromptEvent = event;
      render();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      });
    }

    function baseState() {
      return {
        news: [],
        jobs: [],
        resumes: [],
        vacancies: [],
        products: [],
        threads: [],
        officialNews: [],
        officialNewsUpdatedAt: null,
        officialNewsError: null,
        officialSources: [],
        currentUser: null,
        storage: { mode: "json", dbConfigured: false, dbReady: false },
      };
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
    }

    function dateLabel(value) {
      if (!value) return "";
      return new Date(value).toLocaleDateString("es-CO", { day: "2-digit", month: "short" });
    }

    function dateTimeLabel(value) {
      if (!value) return "Actualizando";
      return new Date(value).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function user() {
      return state.currentUser || null;
    }

    function officialItems() {
      return Array.isArray(state.officialNews) ? state.officialNews : [];
    }

    function officialStrip() {
      const items = officialItems().slice(0, 3);
      const status = state.officialNewsError || "Consultando Coljuegos, UIAF, Supersalud y DIAN";
      if (!items.length) {
        return `<div class="official-strip"><div class="official-strip-head"><strong>Fuentes oficiales</strong><span>${esc(status)}</span></div></div>`;
      }
      return `<div class="official-strip">
        <div class="official-strip-head"><strong>Fuentes oficiales</strong><span>${esc(dateTimeLabel(state.officialNewsUpdatedAt))}</span></div>
        <div class="official-links">
          ${items.map((item) => `<a class="official-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(item.entity)}</strong><span>${esc(item.title)}</span></a>`).join("")}
        </div>
      </div>`;
    }

    function hero(title, subtitle, showOfficial = false) {
      return `<div class="hero"><div class="logo-card" role="img" aria-label="Logo Link"></div><div><p class="hero-kicker">Link</p><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div></div>${showOfficial ? officialStrip() : ""}${installCard()}`;
    }

    function installCard() {
      return `<div class="install-card"><div><strong>Instalar Link</strong><span>Agregala al celular como app.</span></div><button class="install-btn" type="button" id="installButton">Descargar app</button></div><p class="install-help" id="installHelp"></p>`;
    }

    async function installApp() {
      const help = document.querySelector("#installHelp");
      if (installPromptEvent) {
        installPromptEvent.prompt();
        await installPromptEvent.userChoice.catch(() => {});
        installPromptEvent = null;
        return;
      }
      if (help) {
        help.textContent = /iphone|ipad|ipod/i.test(navigator.userAgent)
          ? "En iPhone abre esta pagina en Safari, toca Compartir y luego Agregar a pantalla de inicio."
          : "Si no aparece el instalador, abre el menu del navegador y elige Instalar app o Agregar a pantalla principal.";
        help.classList.add("show");
      }
    }

    function renderTabs() {
      nav.innerHTML = tabs.map((tab) => `<button class="tab ${active === tab[0] ? "active" : ""}" data-tab="${tab[0]}" type="button"><i aria-hidden="true"></i><small>${tab[1]}</small></button>`).join("");
      nav.querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          active = button.dataset.tab;
          render();
        };
      });
    }

    function formError(message = "") {
      return `<p class="error ${message ? "show" : ""}" id="formError">${esc(message)}</p>`;
    }

    function empty(text) {
      return `<div class="empty">${esc(text)}</div>`;
    }

    function editor(summary, action, fields) {
      return `<details class="editor"><summary>${esc(summary)}</summary><form class="form" data-action="${action}">${fields}<button class="primary" type="submit">Guardar</button></form></details>`;
    }

    function locked(label) {
      return `<div class="locked"><strong>Cuenta requerida</strong><span>${esc(label)}</span></div>`;
    }

    function accountPanel() {
      const current = user();
      if (current) {
        const type = current.accountType === "company" ? "Empresa" : "Persona natural";
        return `<div class="account-card">
          <div><strong>${esc(current.displayName)}</strong><span>${esc(type)} · ${esc(current.email)} · ${esc(state.storage?.mode === "postgres" ? "PostgreSQL" : "JSON local")}</span></div>
          <button class="secondary" type="button" id="logoutButton">Cerrar sesion</button>
        </div>`;
      }
      return `<div class="auth-grid">
        <details class="editor" open>
          <summary>Crear cuenta</summary>
          <form class="form" data-auth="register">
            <select name="accountType">
              <option value="person">Persona natural</option>
              <option value="company">Empresa</option>
            </select>
            <input name="displayName" placeholder="Nombre completo o empresa" required>
            <div class="split">
              <input name="email" type="email" placeholder="Correo" required>
              <input name="password" type="password" placeholder="Clave" required minlength="6">
            </div>
            <div class="split">
              <input name="phone" placeholder="Telefono">
              <input name="city" placeholder="Ciudad">
            </div>
            <div class="split">
              <input name="companyName" placeholder="Razon social">
              <input name="nit" placeholder="NIT">
            </div>
            <input name="role" placeholder="Cargo u oficio">
            <button class="primary" type="submit">Crear cuenta</button>
          </form>
        </details>
        <details class="editor">
          <summary>Ingresar</summary>
          <form class="form" data-auth="login">
            <input name="email" type="email" placeholder="Correo" required>
            <input name="password" type="password" placeholder="Clave" required>
            <button class="primary" type="submit">Ingresar</button>
          </form>
        </details>
      </div>`;
    }

    function renderInicio() {
      const official = officialItems();
      const officialList = official.length ? official.map((item) => `
        <a class="source-card" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
          <div class="topline"><span>${esc(item.entity)}</span><strong>ORIGEN</strong></div>
          <h3>${esc(item.title)}</h3>
          ${item.summary ? `<p>${esc(item.summary)}</p>` : ""}
          <span class="origin-link">Abrir en ${esc(item.entity)}</span>
        </a>`).join("") : empty(state.officialNewsError || "Aun no se encontraron publicaciones oficiales con palabras de casinos o juegos localizados.");
      const list = state.news.length ? state.news.map((item) => `
        <article class="card">
          <div class="topline"><span>${esc(item.category)}</span><strong>${esc(dateLabel(item.createdAt))}</strong></div>
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.body)}</p>
          <div class="meta">${item.contact ? `<span class="pill">Fuente: ${esc(item.contact)}</span>` : ""}</div>
        </article>`).join("") : empty("Aun no hay publicaciones internas.");
      return `<section class="screen">${hero("Al Dia", "Informacion oficial y publicaciones de interes del sector.", true)}
        <div class="section-title"><h2>Fuentes oficiales</h2><small>${official.length}</small></div>
        <div class="official-list">${officialList}</div>
        ${formError()}
        ${user() ? editor("Nueva informacion interna", "/api/news", `
          <input name="title" placeholder="Titulo de la noticia, resolucion o comunicado" required>
          <div class="split">
            <select name="category">
              <option>Coljuegos</option>
              <option>UIAF</option>
              <option>DIAN</option>
              <option>Supersalud</option>
              <option>Otra entidad</option>
            </select>
            <input name="contact" placeholder="Fuente o enlace oficial">
          </div>
          <textarea name="body" placeholder="Resumen o contenido" required></textarea>
        `) : locked("Inicia sesion para publicar informacion interna.")}
        <div class="section-title"><h2>Publicaciones internas</h2><small>${state.news.length}</small></div>
        <div class="stack">${list}</div>
      </section>`;
    }

    function resumePhoto(item) {
      return item.photoData ? `<div class="profile-photo"><img src="${esc(item.photoData)}" alt=""></div>` : `<div class="profile-photo">${esc((item.fullName || "L").slice(0, 1))}</div>`;
    }

    function renderBolsa() {
      const current = user();
      const resumes = state.resumes.length ? state.resumes.map((item) => `
        <article class="card resume-card">
          <div class="profile-row">
            ${resumePhoto(item)}
            <div>
              <div class="topline"><span>${esc(item.city || "Sin ciudad")}</span><strong>${esc(dateLabel(item.updatedAt || item.createdAt))}</strong></div>
              <h3>${esc(item.fullName)}</h3>
              <p><strong>${esc(item.headline)}</strong></p>
            </div>
          </div>
          ${item.summary ? `<p>${esc(item.summary)}</p>` : ""}
          <div class="meta">
            ${item.phone ? `<span class="pill">${esc(item.phone)}</span>` : ""}
            ${item.email ? `<span class="pill">${esc(item.email)}</span>` : ""}
            ${item.availability ? `<span class="pill">${esc(item.availability)}</span>` : ""}
          </div>
          <div class="action-row"><a class="mini-btn" href="/cv/${esc(item.id)}" target="_blank" rel="noopener noreferrer">Imprimir CV</a></div>
        </article>`).join("") : empty("Aun no hay hojas de vida publicadas.");

      const vacancies = state.vacancies.length ? state.vacancies.map((item) => `
        <article class="card">
          <div class="topline"><span>${esc(item.city || "Sin ciudad")}</span><strong>${esc(dateLabel(item.createdAt))}</strong></div>
          <h3>${esc(item.title)}</h3>
          <p><strong>${esc(item.company)}</strong></p>
          ${item.description ? `<p>${esc(item.description)}</p>` : ""}
          ${item.requirements ? `<p>${esc(item.requirements)}</p>` : ""}
          <div class="meta">
            ${item.salary ? `<span class="pill">${esc(item.salary)}</span>` : ""}
            ${item.contact ? `<span class="pill">${esc(item.contact)}</span>` : ""}
          </div>
        </article>`).join("") : empty("Aun no hay vacantes publicadas.");

      const personForm = editor("Crear hoja de vida", "/api/resumes", `
        <input name="photoFile" type="file" accept="image/*">
        <input name="fullName" placeholder="Nombre completo" required>
        <input name="headline" placeholder="Perfil: tecnico, administrador, cajero, compliance..." required>
        <div class="split">
          <input name="documentId" placeholder="Documento">
          <input name="city" placeholder="Ciudad">
        </div>
        <div class="split">
          <input name="phone" placeholder="Telefono">
          <input name="email" type="email" placeholder="Correo">
        </div>
        <div class="split">
          <input name="availability" placeholder="Disponibilidad">
          <input name="salary" placeholder="Aspiracion salarial">
        </div>
        <textarea name="summary" placeholder="Perfil profesional"></textarea>
        <textarea name="experience" placeholder="Experiencia laboral"></textarea>
        <textarea name="education" placeholder="Formacion, cursos y certificaciones"></textarea>
        <textarea name="skills" placeholder="Competencias tecnicas"></textarea>
        <textarea name="referencesText" placeholder="Referencias"></textarea>
        <input name="attachmentFile" type="file" accept="application/pdf,.pdf">
      `);

      const companyForm = editor("Publicar vacante", "/api/vacancies", `
        <input name="company" placeholder="Empresa" required>
        <input name="title" placeholder="Cargo requerido" required>
        <div class="split">
          <input name="city" placeholder="Ciudad">
          <input name="salary" placeholder="Salario o rango">
        </div>
        <input name="contact" placeholder="Contacto">
        <textarea name="description" placeholder="Descripcion del cargo"></textarea>
        <textarea name="requirements" placeholder="Requisitos"></textarea>
      `);

      const publishBlock = current
        ? `${current.accountType === "company" ? companyForm : personForm}`
        : locked("Crea una cuenta para subir hoja de vida o publicar vacantes.");

      return `<section class="screen">${hero("Bolsa de Empleo", "Hojas de vida, vacantes y contactos profesionales del sector.")}
        ${formError()}
        ${accountPanel()}
        ${publishBlock}
        <div class="section-title"><h2>Hojas de vida</h2><small>${state.resumes.length}</small></div>
        <div class="stack">${resumes}</div>
        <div class="section-title"><h2>Vacantes</h2><small>${state.vacancies.length}</small></div>
        <div class="stack">${vacancies}</div>
      </section>`;
    }

    function renderMarketplace() {
      const list = state.products.length ? state.products.map((item) => `
        <article class="card product">
          <div class="product-logo" aria-hidden="true"></div>
          <div class="product-body">
            <h3>${esc(item.name)}</h3>
            <strong class="price">${esc(item.price)}</strong>
            <p>${esc(item.description || "")}</p>
            <div class="meta"><span class="pill">${esc(item.condition)}</span>${item.contact ? `<span class="pill">${esc(item.contact)}</span>` : ""}</div>
          </div>
        </article>`).join("") : empty("Aun no hay productos publicados.");
      return `<section class="screen">${hero("Mercado", "Clasificados de equipos, repuestos y servicios del sector.")}
        ${formError()}
        ${accountPanel()}
        ${user() ? editor("Publicar producto o servicio", "/api/products", `
          <input name="name" placeholder="Producto o servicio" required>
          <div class="split">
            <input name="price" placeholder="Precio" required>
            <select name="condition">
              <option>Disponible</option>
              <option>Nuevo</option>
              <option>Usado</option>
              <option>Para piezas</option>
              <option>Servicio</option>
            </select>
          </div>
          <input name="contact" placeholder="Contacto">
          <textarea name="description" placeholder="Descripcion"></textarea>
        `) : locked("Inicia sesion para publicar en el mercado.")}
        <div class="section-title"><h2>Publicaciones</h2><small>${state.products.length}</small></div>
        <div class="product-grid">${list}</div>
      </section>`;
    }

    function renderMensajes() {
      const activeThread = state.threads.find((thread) => thread.id === activeThreadId) || state.threads[0];
      if (activeThread && activeThread.id !== activeThreadId) activeThreadId = activeThread.id;
      const threads = state.threads.length ? state.threads.map((thread) => `
        <button class="thread ${thread.id === activeThreadId ? "active" : ""}" data-thread="${esc(thread.id)}" type="button">
          <div class="avatar">${esc(thread.name[0] || "L")}</div>
          <div><strong>${esc(thread.name)}</strong><small>${esc(thread.topic)}</small></div>
        </button>`).join("") : empty("Aun no hay conversaciones.");
      const chat = activeThread ? `
        <div class="chat">
          <div class="bubble-stack">
            ${(activeThread.messages || []).map((message) => `<div class="bubble ${user() && message.author === user().displayName ? "mine" : ""}"><strong>${esc(message.author)}</strong><p>${esc(message.text)}</p></div>`).join("")}
          </div>
          ${user() ? `<form class="inline-form" data-message="${esc(activeThread.id)}"><input name="message" placeholder="Mensaje" required><button class="primary" type="submit">Enviar</button></form>` : locked("Inicia sesion para responder.")}
        </div>` : "";
      return `<section class="screen">${hero("Mensajes", "Conversaciones internas y contactos de la red Link.")}
        ${formError()}
        ${accountPanel()}
        ${user() ? editor("Nueva conversacion", "/api/threads", `
          <input name="topic" placeholder="Tema">
          <textarea name="message" placeholder="Mensaje inicial" required></textarea>
        `) : locked("Inicia sesion para crear conversaciones.")}
        <div class="section-title"><h2>Conversaciones</h2><small>${state.threads.length}</small></div>
        <div class="threads">${threads}</div>
        ${chat}
      </section>`;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
        reader.readAsDataURL(file);
      });
    }

    async function payloadFromForm(form) {
      const payload = {};
      const formData = new FormData(form);
      for (const [key, value] of formData.entries()) {
        if (value instanceof File) {
          if (!value.name || value.size === 0) continue;
          if (key === "photoFile") {
            if (value.size > 1_500_000) throw new Error("La foto debe pesar menos de 1.5 MB");
            payload.photoData = await fileToDataUrl(value);
          } else if (key === "attachmentFile") {
            if (value.size > 3_500_000) throw new Error("El PDF debe pesar menos de 3.5 MB");
            payload.attachmentName = value.name;
            payload.attachmentData = await fileToDataUrl(value);
          }
        } else {
          payload[key] = value;
        }
      }
      return payload;
    }

    function bindForms() {
      const installButton = document.querySelector("#installButton");
      if (installButton) installButton.onclick = installApp;
      const logoutButton = document.querySelector("#logoutButton");
      if (logoutButton) logoutButton.onclick = logout;
      document.querySelectorAll("form[data-auth]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await auth(form.dataset.auth, await payloadFromForm(form));
        };
      });
      document.querySelectorAll("form[data-action]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await save(form.dataset.action, await payloadFromForm(form));
        };
      });
      document.querySelectorAll("form[data-message]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await save(`/api/threads/${form.dataset.message}/messages`, await payloadFromForm(form));
        };
      });
      document.querySelectorAll(".thread[data-thread]").forEach((button) => {
        button.onclick = () => {
          activeThreadId = button.dataset.thread;
          render();
        };
      });
    }

    function showError(error) {
      const box = document.querySelector("#formError");
      if (box) {
        box.textContent = error.message;
        box.classList.add("show");
      }
    }

    async function auth(kind, payload) {
      try {
        const data = await api.post(kind === "register" ? "/api/auth/register" : "/api/auth/login", payload);
        sessionToken = data.token;
        localStorage.setItem(authKey, sessionToken);
        state = await api.state();
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function logout() {
      try {
        await api.post("/api/auth/logout", {});
      } catch {}
      sessionToken = "";
      localStorage.removeItem(authKey);
      state = await api.state().catch(() => ({ ...baseState(), officialNews: state.officialNews, officialNewsUpdatedAt: state.officialNewsUpdatedAt }));
      render();
    }

    async function save(path, payload) {
      try {
        await api.post(path, payload);
        state = await api.state();
        render();
      } catch (error) {
        showError(error);
      }
    }

    function render() {
      renderTabs();
      if (active === "inicio") content.innerHTML = renderInicio();
      if (active === "empleos") content.innerHTML = renderBolsa();
      if (active === "marketplace") content.innerHTML = renderMarketplace();
      if (active === "mensajes") content.innerHTML = renderMensajes();
      bindForms();
    }

    async function hydrateOfficialNews() {
      if (officialItems().length || state.officialNewsError) return;
      try {
        const official = await api.officialNews(true);
        state = {
          ...state,
          officialNews: official.items || [],
          officialNewsUpdatedAt: official.updatedAt || null,
          officialNewsError: official.error || null,
          officialSources: official.sources || [],
        };
      } catch {
        state = {
          ...state,
          officialNews: [],
          officialNewsUpdatedAt: null,
          officialNewsError: "Backend no conectado. Esta pantalla no esta recibiendo datos del servidor.",
        };
      }
      if (active === "inicio") render();
    }

    async function boot() {
      renderTabs();
      content.innerHTML = `<section class="screen splash"><div class="logo-hero" role="img" aria-label="Logo Link"></div><h1>Link</h1><p>Cargando la aplicacion...</p><div class="splash-news"><strong>Al Dia</strong><span>Consultando publicaciones oficiales de Coljuegos, UIAF, Supersalud y DIAN.</span></div><div class="loader"></div></section>`;
      try {
        state = await api.state();
      } catch {
        state = {
          ...baseState(),
          officialNewsError: "Backend no conectado. Abre la app desde el link publico de Render o desde localhost con el servidor activo.",
        };
      }
      render();
      hydrateOfficialNews();
    }

    boot();
  </script>
</body>
</html>
