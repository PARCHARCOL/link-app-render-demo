<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Link</title>
  <meta name="description" content="Link: aplicacion online para noticias oficiales, bolsa de empleo, compra/ventas, mensajes y administracion del sector.">
  <meta name="theme-color" content="#ff6a00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Link">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest?v=link-app-v34">
  <link rel="apple-touch-icon" href="/icon-192.png?v=link-app-v34">
  <link rel="preload" href="/logolink.png?v=link-app-v34" as="image">
  <style>
    :root{--bg:#fff6ef;--paper:#fffdf9;--card:#ffffff;--soft:#fff0e3;--field:#fff9f2;--line:#f2c9ad;--line2:#e7a778;--ink:#1e1712;--muted:#735e50;--muted2:#9d8778;--orange:#ff6a00;--orange2:#ffb000;--red:#d71920;--red2:#ff3d2e;--blue:#1476ff;--green:#1f9d55;--shadow:0 24px 70px rgba(128,49,0,.22)}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    .stage{width:100%;max-width:100vw;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:12px;overflow:hidden;background:linear-gradient(135deg,#fffdf8 0%,#fff2e7 46%,#ffd5c2 100%)}
    .app{width:min(100%,760px);max-width:calc(100vw - 24px);height:min(980px,calc(100vh - 24px));height:min(980px,calc(100dvh - 24px));min-height:640px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);border:1px solid rgba(215,25,32,.22);border-radius:26px;box-shadow:var(--shadow)}
    .app-header{padding:12px 24px 14px;background:linear-gradient(180deg,#ffffff 0%,#fff5ed 100%);border-bottom:1px solid var(--line)}
    .phone-status{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;color:#2a211b;font-size:12px;font-weight:900}
    .phone-status small{color:var(--red);font-weight:900}
    .brand-row{width:100%;min-width:0;display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:16px}
    .brand-mark,.logo-card,.logo-hero,.login-logo{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 45% 32%,#3b230b 0%,#140d09 58%,#000 100%);border:3px solid #fff;border-radius:20px;box-shadow:0 14px 26px rgba(255,106,0,.28)}
    .brand-mark{width:78px;height:78px}
    .brand-mark img,.logo-card img,.logo-hero img,.login-logo img,.product-logo img{width:100%;height:100%;object-fit:contain}
    .brand-mark video,.logo-card video,.logo-hero video,.login-logo video{width:100%;height:100%;object-fit:contain}
    .brand-copy{min-width:0}
    .brand-copy p{margin:0 0 2px;color:var(--red);font-size:11px;font-weight:900;text-transform:uppercase}
    .brand-copy strong{display:block;margin:0;color:var(--ink);font-size:32px;line-height:1;font-weight:950}
    .brand-copy span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.28}
    .header-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;min-width:0;max-width:100%}
    .header-action{min-height:44px;min-width:152px;padding:0 18px;color:#fff;background:linear-gradient(180deg,#ff9148,#ef5f00);border:0;border-radius:8px;box-shadow:0 7px 13px rgba(137,57,0,.28);font-weight:850;letter-spacing:.2px}
    .header-action.secondary-action{background:linear-gradient(180deg,#ff9148,#ef5f00)}
    .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(82px,1fr);gap:10px;overflow-x:auto;padding:0 2px 2px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .menu-btn{min-width:0;display:grid;justify-items:center;align-content:start;gap:5px;padding:7px 4px;color:#6f5b4c;background:transparent;border:0;border-radius:16px}
    .menu-icon{width:56px;height:56px;display:grid;place-items:center;color:#ffffff;background:linear-gradient(180deg,#ff9b2a,#d71920);border-radius:16px;box-shadow:0 9px 18px rgba(215,25,32,.26);font-size:16px;font-weight:950}
    .menu-icon svg{width:28px;height:28px;display:block}
    .menu-btn span:last-child{max-width:108px;min-height:24px;overflow:hidden;font-size:10.5px;font-weight:900;line-height:1.1;text-align:center;white-space:normal}
    .menu-btn.active{background:#ffffff;color:var(--red);box-shadow:inset 0 0 0 1px rgba(215,25,32,.16)}
    .menu-btn.active .menu-icon{background:linear-gradient(180deg,#1476ff,#0042b8)}
    .download-menu .menu-icon{background:linear-gradient(180deg,#ffd76a,#ff6a00);color:#241407}
    #content{min-height:0;overflow:hidden}
    .screen{height:100%;min-width:0;overflow-y:auto;padding:18px 24px 28px;scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .splash{height:100%;display:grid;align-content:center;justify-items:center;padding:34px;text-align:center;background:linear-gradient(180deg,#fffaf4,#fff1e6)}
    .logo-hero{width:168px;height:126px;margin-bottom:18px;border-radius:24px}
    .splash h1{margin:0;color:var(--red);font-size:42px;line-height:1;font-weight:950}
    .splash p{max-width:280px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
    .loader{width:132px;height:4px;overflow:hidden;margin-top:24px;background:#f2d4bf;border-radius:999px}
    .loader::after{content:"";display:block;width:44%;height:100%;background:linear-gradient(90deg,var(--red),var(--orange));border-radius:999px;animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    .hero{display:grid;grid-template-columns:82px 1fr;gap:13px;align-items:center;margin-bottom:13px}
    .logo-card{width:82px;height:72px;border-radius:18px}
    .hero-kicker{margin:0 0 3px;color:var(--red);font-size:11px;font-weight:950;text-transform:uppercase}
    .hero h1{margin:0;color:var(--ink);font-size:29px;line-height:1.02;font-weight:950}
    .hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.34}
    .notice,.error{margin:0 0 13px;padding:11px 12px;border-radius:14px;font-size:12px;line-height:1.35}
    .notice{color:#5b3100;background:#fff0cc;border:1px solid #ffd37a}
    .update-banner{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:0 0 13px;padding:12px;background:#fff;border:2px solid var(--red);border-radius:16px;box-shadow:0 14px 30px rgba(215,25,32,.14)}
    .update-banner strong{display:block;color:var(--red);font-size:13px}
    .update-banner span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}
    .error{display:none;color:#7a090d;background:#ffe6e5;border:1px solid #ffb8b3}
    .error.show{display:block}
    .global-error{position:fixed;left:50%;bottom:18px;z-index:50;display:none;width:min(92vw,520px);transform:translateX(-50%);padding:13px 14px;color:#7a090d;background:#ffe6e5;border:1px solid #ff9f99;border-radius:14px;box-shadow:0 18px 40px rgba(100,10,10,.22);font-size:13px;font-weight:850;line-height:1.35}
    .global-error.show{display:block}
    .global-notice{position:fixed;left:50%;bottom:18px;z-index:49;display:none;width:min(92vw,520px);transform:translateX(-50%);padding:13px 14px;color:#063a1d;background:#e9f9ef;border:1px solid #9cdfb5;border-radius:14px;box-shadow:0 18px 40px rgba(10,80,35,.18);font-size:13px;font-weight:850;line-height:1.35}
    .global-notice.show{display:block}
    .ad-banner{position:relative;isolation:isolate;min-height:224px;display:grid;grid-template-columns:134px minmax(0,1fr);gap:14px;align-items:center;margin:10px 16px max(10px,env(safe-area-inset-bottom));padding:0 14px 54px;overflow:hidden;color:#fff;background:#fff7ea;border:1px solid rgba(255,106,0,.58);border-radius:14px;box-shadow:0 -10px 24px rgba(146,70,18,.08),0 12px 28px rgba(35,8,0,.18)}
    .ad-banner::after{content:"";position:absolute;inset:0 0 54px 0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.52) 36%,rgba(0,0,0,.18) 66%,rgba(0,0,0,.66) 100%)}
    .ad-media{position:absolute;inset:0 0 54px 0;z-index:-2;display:grid;place-items:center;width:auto;height:auto;overflow:hidden;background:radial-gradient(circle at 78% 50%,rgba(255,179,70,.4),transparent 0 20%,transparent 42%),linear-gradient(135deg,#120500 0%,#4c1102 43%,#d71920 100%)}
    .ad-media::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.24),transparent 34%,rgba(0,0,0,.2));pointer-events:none}
    .ad-media-main{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:saturate(1.06) brightness(.9)}
    .ad-media img,.ad-media video{display:block}
    .ad-media.ad-placeholder{background:radial-gradient(circle at 78% 55%,rgba(255,190,89,.45),transparent 0 18%,transparent 36%),linear-gradient(135deg,#0b0503 0%,#5a1604 42%,#d71920 100%)}
    .ad-copy{min-width:0;align-self:stretch;display:grid;align-content:space-between;padding:28px 0 18px;text-shadow:0 2px 10px rgba(0,0,0,.65)}
    .ad-copy::before{content:"ANUNCIO";width:max-content;padding:2px 6px;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.82);border-radius:6px;font-size:8px;font-weight:950;letter-spacing:.2px}
    .ad-copy strong,.ad-copy span{display:block;overflow:hidden;text-overflow:ellipsis}
    .ad-copy strong{color:#fff;font-size:14px;font-weight:950;line-height:1.12;white-space:nowrap}
    .ad-copy span{margin-top:3px;color:#fff4de;font-size:9px;font-weight:950;line-height:1.15;text-transform:uppercase;white-space:normal}
    .ad-actions{position:absolute;left:0;right:0;bottom:0;z-index:2;min-height:54px;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 12px;background:#fff7ea;border-top:1px solid var(--line)}
    .ad-actions .mini-btn,.ad-actions .secondary{min-height:38px;white-space:nowrap;border-radius:9px}
    .ad-actions .mini-btn{padding:0 18px;color:#2b1300;background:linear-gradient(180deg,#ffd36b,#ff9e2e)}
    .ad-actions .secondary{color:var(--red);background:#fff;border-color:#fff}
    .verify-row,.account-card,.locked,.settings-card{display:grid;gap:10px;margin-bottom:13px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 28px rgba(146,70,18,.08)}
    .verify-row{grid-template-columns:1fr auto;align-items:center}
    .verify-row strong,.account-card strong,.locked strong,.settings-card strong{display:block;font-size:13px}
    .verify-row span,.account-card span,.locked span,.settings-card span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}
    .primary,.secondary,.mini-btn,.danger-btn{min-height:40px;padding:0 14px;border:0;border-radius:13px;font-weight:950}
    .primary,.mini-btn{color:#ffffff;background:linear-gradient(180deg,var(--orange),var(--red))}
    .secondary{color:var(--red);background:#ffffff;border:1px solid rgba(215,25,32,.26)}
    .danger-btn{color:#ffffff;background:#9b1118}
    .mini-btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;font-size:12px;text-decoration:none}
    .newspaper{display:grid;gap:10px;margin-bottom:15px}
    .lead-story,.story-card,.source-card,.card{display:block;min-width:0;color:inherit;text-decoration:none;background:#ffffff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 26px rgba(146,70,18,.08);overflow-wrap:anywhere}
    .lead-story{padding:16px;border-left:6px solid var(--red)}
    .story-list{display:grid;gap:9px}
    .story-card{padding:13px;border-left:4px solid var(--orange)}
    .source-card{padding:14px}
    .lead-story:hover,.story-card:hover,.source-card:hover{border-color:var(--red)}
    .news-tag,.status-badge{display:inline-flex;align-items:center;min-height:22px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:950}
    .news-tag{color:#ffffff;background:linear-gradient(180deg,var(--red2),var(--red))}
    .status-badge{color:#7a3a00;background:#fff0cc;border:1px solid #ffd28a}
    .status-badge.published{color:#0d6730;background:#e7f8ee;border-color:#a7dfbd}
    .status-badge.hidden{color:#6f1720;background:#ffe8e7;border-color:#ffb6b4}
    .status-badge.active{color:#0d6730;background:#e7f8ee;border-color:#a7dfbd}
    .status-badge.inactive{color:#6f1720;background:#ffe8e7;border-color:#ffb6b4}
    .status-badge.approved{color:#0d6730;background:#e7f8ee;border-color:#a7dfbd}
    .status-badge.rejected{color:#6f1720;background:#ffe8e7;border-color:#ffb6b4}
    .lead-story h2,.story-card h3,.source-card h3,.card h3{margin:8px 0 0;color:var(--ink);line-height:1.18;font-weight:950}
    .lead-story h2{font-size:24px}
    .story-card h3,.source-card h3,.card h3{font-size:16px}
    .lead-story p,.story-card p,.source-card p,.card p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.4;white-space:pre-line}
    .origin-link,.text-link{display:inline-flex;margin-top:10px;color:var(--red);font-size:12px;font-weight:950;text-decoration:none}
    details.editor{margin-bottom:13px;background:#ffffff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 26px rgba(146,70,18,.07)}
    details.editor summary{list-style:none;padding:14px;color:var(--ink);font-size:14px;font-weight:950}
    details.editor summary::-webkit-details-marker{display:none}
    details.editor[open] summary{border-bottom:1px solid var(--line)}
    .form{display:grid;gap:10px;padding:12px 14px 14px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .is-hidden{display:none!important}
    input,textarea,select{width:100%;min-width:0;color:var(--ink);background:var(--field);border:1px solid #efbea0;border-radius:13px;outline:0;padding:11px 12px}
    input[type="file"]{padding:9px 10px;color:var(--muted);font-size:12px}
    .file-field{display:grid;gap:7px;padding:10px;color:var(--ink);background:#fff;border:1px solid #efbea0;border-radius:15px}
    .file-field span{font-size:12px;font-weight:950}
    .file-field small{color:var(--muted);font-size:11px;line-height:1.35}
    .file-field input{background:#fff9f2}
    textarea{min-height:92px;resize:vertical}
    input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,106,0,.14)}
    input::placeholder,textarea::placeholder{color:var(--muted2)}
    .check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;font-weight:800}
    .check input{width:auto}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:10px 0 10px}
    .section-title h2{margin:0;font-size:17px;line-height:1.1}
    .section-title small{color:var(--muted2);font-size:12px;font-weight:900}
    .stack{display:grid;gap:10px}
    .empty{display:grid;place-items:center;min-height:108px;padding:18px 14px;color:var(--muted);background:#fffdf9;border:1px dashed #e9b596;border-radius:18px;text-align:center;font-size:13px;line-height:1.35}
    .card{padding:14px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:950}
    .topline strong{color:var(--red);white-space:nowrap}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;color:#7a3a00;background:#fff0cc;border:1px solid #ffd28a;border-radius:9px;font-size:11px;font-weight:950}
    .auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .login-brand{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px;padding:13px;background:#ffffff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 28px rgba(146,70,18,.08)}
    .login-logo{width:76px;height:76px}
    .login-brand strong{display:block;margin:0;color:var(--ink);font-size:24px;line-height:1;font-weight:950}
    .login-brand span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}
    .logo-admin-preview{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;padding:10px;background:#fff9f2;border:1px solid var(--line);border-radius:14px}
    .logo-admin-preview .brand-mark{width:72px;height:72px}
    .logo-admin-preview p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
    .profile-row{display:grid;grid-template-columns:56px 1fr;gap:11px;align-items:center}
    .profile-photo{width:56px;height:64px;display:grid;place-items:center;overflow:hidden;background:#fff1e6;border:1px solid var(--line);border-radius:13px;color:var(--red);font-weight:950}
    .profile-photo img{width:100%;height:100%;object-fit:cover}
    .resume-card{display:grid;gap:12px}
    .detail-panel{display:grid;gap:8px;margin-top:2px;padding:11px;background:#fff9f2;border:1px solid var(--line);border-radius:14px}
    .detail-panel h4{margin:0;color:var(--red);font-size:12px;text-transform:uppercase}
    .detail-panel p{margin:0;color:var(--ink);font-size:12px;line-height:1.42}
    .filter-row{display:flex;gap:8px;margin:0 0 12px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none}
    .filter-row::-webkit-scrollbar{display:none}
    .filter-chip{flex:0 0 auto;min-height:34px;padding:0 11px;color:#7a3a00;background:#fff7ea;border:1px solid #ffd28a;border-radius:999px;font-size:12px;font-weight:950}
    .filter-chip.active{color:#fff;background:linear-gradient(180deg,var(--orange),var(--red));border-color:transparent}
    .action-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .module-actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
    .module-actions .primary,.module-actions .secondary{min-width:180px}
    .flow-panel{display:grid;gap:16px;justify-items:center;margin:4px 0 16px;padding:10px 0}
    .flow-main,.flow-btn{min-height:78px;color:#fff;background:linear-gradient(180deg,#ff9448,#f06a00);border:0;border-radius:14px;box-shadow:0 10px 18px rgba(141,63,0,.22);font-size:22px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
    .flow-main{width:min(230px,100%);font-size:24px}
    .flow-branches{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
    .flow-btn{width:100%;padding:12px 16px;line-height:1.22}
    .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .product{overflow:hidden;padding:0}
    .product-logo,.product-media{height:158px;display:grid;place-items:center;overflow:hidden;background:#fff8ef;border-bottom:1px solid var(--line)}
    .product-logo img,.product-media img,.product-media video{width:100%;height:100%;object-fit:contain}
    .product-logo img{max-width:92%;max-height:86%;object-fit:contain}
    .product-body{padding:12px}
    .product h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
    .price{display:block;margin-top:4px;color:var(--red);font-size:13px;font-weight:950}
    .threads{display:grid;gap:8px;margin-bottom:12px}
    .thread{width:100%;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px;color:var(--ink);background:#ffffff;border:1px solid var(--line);border-radius:16px;text-align:left}
    .thread.active{border-color:var(--red);background:#fff0e3}
    .avatar{width:44px;height:44px;display:grid;place-items:center;color:#ffffff;background:linear-gradient(180deg,var(--orange),var(--red));border-radius:14px;font-size:16px;font-weight:950}
    .thread strong,.thread small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .thread small{margin-top:3px;color:var(--muted);font-size:12px}
    .chat{padding:12px;background:#ffffff;border:1px solid var(--line);border-radius:18px}
    .bubble-stack{display:grid;gap:8px;margin-bottom:10px}
    .bubble{max-width:86%;justify-self:start;padding:9px 11px;background:#fff0e3;border-radius:15px}
    .bubble.mine{justify-self:end;color:#ffffff;background:linear-gradient(180deg,var(--orange),var(--red))}
    .bubble strong{display:block;margin-bottom:3px;color:inherit;opacity:.75;font-size:10px}
    .bubble p{margin:0;font-size:13px;line-height:1.32}
    .inline-form{display:grid;grid-template-columns:1fr auto;gap:8px}
    .field-note{margin:-4px 0 2px;color:var(--muted);font-size:11px;line-height:1.35}
    .blog-feed{display:grid;gap:12px;margin-bottom:14px}
    .blog-post{padding:15px;background:#ffffff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 26px rgba(146,70,18,.08)}
    .blog-post.active{border-color:var(--red);box-shadow:0 16px 34px rgba(215,25,32,.12)}
    .blog-post h3{margin:4px 0 0;font-size:18px;line-height:1.2}
    .blog-post p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.42;white-space:pre-line}
    .comments{display:grid;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
    .comment{padding:9px 10px;background:#fff4ea;border:1px solid #f3d1bb;border-radius:13px}
    .comment strong{display:block;font-size:11px;color:var(--red)}
    .comment p{margin:3px 0 0;font-size:12px;color:var(--ink)}
    .technical-card{margin-top:14px;padding:14px;background:#f8fbff;border:1px solid #a9c9ff;border-radius:18px}
    .technical-card h2{margin:0 0 8px;color:#0b56bd;font-size:17px}
    .admin-grid{display:grid;gap:12px}
    .admin-list{display:grid;gap:8px}
    .admin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px;background:#ffffff;border:1px solid var(--line);border-radius:15px}
    .admin-row h3{margin:0;color:var(--ink);font-size:14px;line-height:1.25}
    .admin-row p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.28}
    .admin-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
    .admin-actions button{min-height:31px;padding:0 9px;border-radius:10px;font-size:11px}
    @media (max-width:820px){.stage{min-height:100dvh;padding:0;place-items:stretch;background:#fff6ef}.app{width:100dvw;max-width:100dvw;height:100dvh;min-height:100dvh;border-left:0;border-right:0;border-radius:0}.app-header{padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 12px max(10px,env(safe-area-inset-left));overflow:hidden}.phone-status{min-width:0}.phone-status small{max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brand-row{grid-template-columns:72px minmax(0,1fr);margin-bottom:12px}.brand-mark{width:72px;height:72px}.brand-copy strong{font-size:30px}.header-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;justify-content:stretch}.header-action{width:100%;min-width:0;padding:0 8px}.tabs{display:flex;grid-auto-flow:unset;grid-auto-columns:unset;grid-template-columns:none;gap:8px;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:0 0 4px;-webkit-overflow-scrolling:touch}.menu-btn{flex:0 0 74px}.download-menu{flex-basis:88px}.menu-icon{width:52px;height:52px}.screen{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:18px}.split,.auth-grid,.verify-row,.update-banner,.flow-branches{grid-template-columns:1fr}.hero{grid-template-columns:76px minmax(0,1fr)}.logo-card{width:76px;height:68px}.hero h1{font-size:26px}.product-grid{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr}.login-brand{grid-template-columns:68px minmax(0,1fr)}.login-logo{width:68px;height:68px}.ad-banner{min-height:204px;grid-template-columns:112px minmax(0,1fr);margin:8px max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));padding:0 10px 50px}.ad-banner::after,.ad-media{inset:0 0 50px 0}.ad-actions{min-height:50px;gap:6px;padding:7px 8px}.ad-actions .mini-btn,.ad-actions .secondary{min-height:36px;padding:0 10px;font-size:11px}.ad-copy{padding:28px 0 18px}.ad-copy strong{font-size:13px}.ad-copy span{font-size:8px}}
    @media (max-width:380px){.brand-row{grid-template-columns:64px minmax(0,1fr)}.brand-mark{width:64px;height:64px}.brand-copy strong{font-size:27px}.menu-btn{flex-basis:68px}.menu-icon{width:48px;height:48px}.menu-btn span:last-child{font-size:10px}.screen{padding-left:10px;padding-right:10px}.hero{grid-template-columns:66px minmax(0,1fr)}.logo-card{width:66px;height:60px}.hero h1{font-size:24px}}

</head>
<body>
  <main class="stage">
    <section class="app" aria-label="Link">
      <header class="app-header">
        <div class="phone-status"><span>9:41</span><small>LINK ONLINE</small></div>
        <div id="headerBrand"></div>
        <nav class="tabs" aria-label="Navegacion principal"></nav>
      </header>
      <div id="content"></div>
      <div id="adBanner" class="ad-banner"></div>
    </section>
    <div id="globalError" class="global-error" role="alert"></div>
    <div id="globalNotice" class="global-notice" role="status"></div>
  </main>
  <script>
    const authKey = "linkSessionToken";
    const queryParams = new URLSearchParams(window.location.search);
    const initialTab = queryParams.get("tab");
    const initialAuth = queryParams.get("auth");
    let sessionToken = localStorage.getItem(authKey) || "";
    let active = ["register", "login", "recover"].includes(initialAuth)
      ? "cuenta"
      : (["inicio", "cuenta"].includes(initialTab) ? initialTab : "inicio");
    let activeThreadId = "";
    let authMode = ["register", "login", "recover"].includes(initialAuth) ? initialAuth : "register";
    let accountMessage = "";
    let bolsaAction = "";
    let activeResumeCategory = "Todos";
    let expandedResumeId = "";
    let activeProductCategory = "Todos";
    let mercadoEditorOpen = false;
    let adRequestOpen = false;
    let installPromptEvent = null;
    let installMessage = "";
    let pendingUpdateWorker = null;
    let updateAvailable = false;
    let adminState = null;
    let adminLoading = false;
    let state = baseState();

    const content = document.querySelector("#content");
    const nav = document.querySelector(".tabs");
    const headerBrand = document.querySelector("#headerBrand");
    const adBanner = document.querySelector("#adBanner");

    const api = {
      headers() {
        return {
          "content-type": "application/json",
          ...(sessionToken ? { authorization: `Bearer ${sessionToken}` } : {}),
        };
      },
      async get(path) {
        const res = await fetch(path, { cache: "no-store", headers: sessionToken ? { authorization: `Bearer ${sessionToken}` } : {} });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "No se pudo cargar");
        return data;
      },
      async state() {
        return this.get("/api/state");
      },
      async officialNews(refresh = false) {
        return this.get(`/api/official-news${refresh ? "?refresh=1" : ""}`);
      },
      async post(path, payload) {
        const res = await fetch(path, {
          method: "POST",
          headers: this.headers(),
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "No se pudo guardar");
        return data;
      },
    };

    window.__LINK_BOOTSTRAP_SETTINGS__ = window.__LINK_BOOTSTRAP_SETTINGS__ || null;
    const appBuild = "link-app-v34";

    const mainTabs = [
      { key: "inicio", label: "Link" },
      { key: "empleos", label: "Bolsa de Empleo" },
      { key: "marketplace", label: "Compra/Ventas" },
      { key: "mensajes", label: "Mensajes" },
    ];

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPromptEvent = event;
      render();
    });

    if ("serviceWorker" in navigator) {
      let reloadingForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadingForUpdate) return;
        reloadingForUpdate = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(`/service-worker.js?v=${appBuild}`).then((registration) => {
          registration.update().catch(() => {});
          if (registration.waiting) showAppUpdate(registration.waiting);
          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener("statechange", () => {
              if (worker.state === "installed" && navigator.serviceWorker.controller) {
                showAppUpdate(worker);
              }
            });
          });
        }).catch(() => {});
      });
    }

    function baseState() {
      return {
        news: [],
        jobs: [],
        resumes: [],
        vacancies: [],
        products: [],
        threads: [],
        officialNews: [],
        officialNewsUpdatedAt: null,
        officialNewsError: null,
        officialSources: [],
        activeAd: null,
        currentUser: null,
        storage: { mode: "json", dbConfigured: false, dbReady: false },
        settings: {
          logoData: "",
          logoUrl: "",
          tokenCvDownloadCost: 10,
          tokenVacancyCost: 25,
          tokenTrialCompanyTokens: 30,
          tokenPackageValue: 50000,
          tokenPackageTokens: 500,
          paymentInfo: "Configure en Admin el Nequi o cuenta para recargar tokens.",
          updatedAt: null,
        },
      };
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[char]);
    }

    function dateLabel(value) {
      if (!value) return "";
      return new Date(value).toLocaleDateString("es-CO", { day: "2-digit", month: "short" });
    }

    function dateTimeLabel(value) {
      if (!value) return "Actualizando";
      return new Date(value).toLocaleString("es-CO", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function user() {
      return state.currentUser || null;
    }

    function isAdmin() {
      return Boolean(user()?.isAdmin);
    }

    function isTechnician() {
      const role = String(user()?.role || "").toLowerCase();
      return role.includes("tecnico") || role.includes("técnico");
    }

    function goAccount(mode = "register") {
      authMode = mode;
      accountMessage = "";
      active = "cuenta";
      render();
    }

    function protectedMessage(tab) {
      if (tab === "empleos") return "Para subir o descargar una hoja de vida debe registrarse o ingresar.";
      if (tab === "marketplace") return "Para publicar ventas, subir fotos o videos en Compra/Ventas debe registrarse o ingresar.";
      if (tab === "mensajes") return "Para escribir, responder o participar en la comunidad tecnica debe registrarse o ingresar.";
      return "Para usar esta opcion debe registrarse o ingresar.";
    }

    function confirmRegistration(tab, mode = "register") {
      if (user()) return true;
      const wantsAccount = window.confirm(`${protectedMessage(tab)}\n\nDesea registrarse o ingresar ahora?`);
      if (wantsAccount) {
        goAccount(mode);
        return false;
      }
      return true;
    }

    function navigateTab(tab) {
      const protectedTabs = new Set(["empleos", "marketplace", "mensajes"]);
      if (protectedTabs.has(tab) && !confirmRegistration(tab)) return;
      active = tab;
      render();
    }

    function syncLogoCache() {
      try {
        localStorage.removeItem("linkLogoData");
      } catch {}
    }

    function applyState(nextState) {
      const incoming = nextState || {};
      state = {
        ...baseState(),
        ...incoming,
        settings: {
          ...baseState().settings,
          ...(incoming.settings || {}),
        },
      };
      syncLogoCache();
      return state;
    }

    function applyBootstrapSettings() {
      const bootstrap = window.__LINK_BOOTSTRAP_SETTINGS__;
      if (!bootstrap?.settings) return;
      applyState({ ...state, settings: bootstrap.settings });
    }

    function logoSrc() {
      return state.settings?.logoUrl || state.settings?.logoData || "/logolink.png?v=link-app-v34";
    }

    function logoImg(className, alt = "Link") {
      const src = logoSrc();
      const isVideo = /^data:video\//i.test(src);
      return `<div class="${className}">${
        isVideo
          ? `<video src="${esc(src)}" muted autoplay loop playsinline aria-label="${esc(alt)}"></video>`
          : `<img src="${esc(src)}" alt="${esc(alt)}">`
      }</div>`;
    }

    function statusText(status) {
      if (status === "pending") return "Pendiente";
      if (status === "hidden") return "Oculto";
      return "Publicado";
    }

    function statusBadge(status) {
      const clean = status || "published";
      return `<span class="status-badge ${esc(clean)}">${esc(statusText(clean))}</span>`;
    }

    function resumeAvailability(value) {
      const clean = String(value || "").trim();
      if (!clean) return "";
      return /^disponibilidad\s*:/i.test(clean) ? clean : `Disponibilidad: ${clean}`;
    }

    const resumeCategories = [
      { key: "Todos", label: "Todos" },
      { key: "Administradores", label: "Administradores", words: ["administrador", "admin", "director", "directivo", "gerente", "operaciones", "analista"] },
      { key: "Maquinas", label: "Maquinas", words: ["maquina", "maquinas", "tragamonedas", "slot", "tecnico", "electronico", "billetero", "met"] },
      { key: "Dealers", label: "Dealers", words: ["dealer", "crupier", "mesa", "ruleta", "blackjack", "poker"] },
      { key: "Seguridad", label: "Seguridad", words: ["seguridad", "vigilante", "control", "riesgo"] },
      { key: "Bar y coctel", label: "Bar y coctel", words: ["bar", "bartender", "coctel", "mesero", "mesera", "bebidas"] },
      { key: "Promotores", label: "Promotores", words: ["promotor", "promotora", "mercadeo", "comercial", "servicio al cliente"] },
      { key: "Otros", label: "Otros" },
    ];

    const productCategories = [
      { key: "Todos", label: "Todos" },
      { key: "Maquina", label: "Maquinas", words: ["maquina", "maquinas", "tragamonedas", "slot"] },
      { key: "Billetero", label: "Billeteros", words: ["billetero", "bill", "mei", "ict", "jcm"] },
      { key: "Tarjeta", label: "Tarjetas", words: ["tarjeta", "board", "placa", "cpu", "main"] },
      { key: "Juego", label: "Juegos", words: ["juego", "game", "software"] },
      { key: "Peana/Cajon", label: "Peanas/Cajones", words: ["peana", "cajon", "cajones", "base", "mueble"] },
      { key: "Repuesto", label: "Repuestos", words: ["repuesto", "sensor", "pantalla", "boton", "fuente"] },
      { key: "Servicio", label: "Servicios", words: ["servicio", "mantenimiento", "reparacion", "instalacion"] },
      { key: "Otros", label: "Otros" },
    ];

    function normalizedText(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function textMatches(words, value) {
      const clean = normalizedText(value);
      return words.some((word) => clean.includes(normalizedText(word)));
    }

    function resumeCategory(item) {
      const stored = String(item.category || "").trim();
      if (stored && resumeCategories.some((category) => category.key === stored)) return stored;
      const haystack = [item.headline, item.summary, item.experience, item.skills].filter(Boolean).join(" ");
      return resumeCategories.find((category) => category.key !== "Todos" && textMatches(category.words || [], haystack))?.key || "Otros";
    }

    function productCategory(item) {
      const stored = String(item.productType || "").trim();
      if (stored === "Peana" || stored === "Cajon") return "Peana/Cajon";
      if (stored === "Otro") return "Otros";
      if (productCategories.some((category) => category.key === stored)) return stored;
      const haystack = [item.productType, item.name, item.brand, item.description, item.game].filter(Boolean).join(" ");
      return productCategories.find((category) => category.key !== "Todos" && textMatches(category.words || [], haystack))?.key || "Otros";
    }

    function filterButtons(items, activeKey, attr, categoryFn, categories) {
      return `<div class="filter-row" role="list">${categories.map((category) => {
        const count = category.key === "Todos" ? items.length : items.filter((item) => categoryFn(item) === category.key).length;
        return `<button class="filter-chip ${activeKey === category.key ? "active" : ""}" ${attr}="${esc(category.key)}" type="button">${esc(category.label)} ${count}</button>`;
      }).join("")}</div>`;
    }

    function userStatusText(status) {
      return status === "inactive" ? "Inactivo" : "Activo";
    }

    function userStatusBadge(status) {
      const clean = status === "inactive" ? "inactive" : "active";
      return `<span class="status-badge ${clean}">${userStatusText(clean)}</span>`;
    }

    function recoveryStatusText(status) {
      if (status === "approved") return "Aprobada";
      if (status === "rejected") return "Rechazada";
      return "Pendiente";
    }

    function recoveryStatusBadge(status) {
      const clean = status || "pending";
      return `<span class="status-badge ${esc(clean)}">${esc(recoveryStatusText(clean))}</span>`;
    }

    function daysSince(value) {
      const time = Date.parse(value || "");
      if (!time) return null;
      return Math.max(0, Math.floor((Date.now() - time) / 86400000));
    }

    function inactivityText(item) {
      const days = daysSince(item.lastSeenAt || item.createdAt);
      if (days === null) return "Sin actividad registrada";
      if (days >= 180) return `${days} dias sin actividad. Revisar para posible baja.`;
      return `${days} dias desde la ultima actividad`;
    }

    function officialItems() {
      return Array.isArray(state.officialNews) ? state.officialNews : [];
    }

    function installNotice() {
      return installMessage ? `<p class="notice">${esc(installMessage)}</p>` : "";
    }

    function money(value) {
      return new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 }).format(Number(value || 0));
    }

    function tokensLabel(value) {
      return `${Number(value || 0).toLocaleString("es-CO")} tokens`;
    }

    function updateNotice() {
      if (!updateAvailable) return "";
      return `<div class="update-banner">
        <div><strong>Hay una nueva version de Link</strong><span>Actualiza para ver los ultimos cambios de la app.</span></div>
        <button class="primary" type="button" id="updateAppButton">Actualizar app</button>
      </div>`;
    }

    function showAppUpdate(worker) {
      pendingUpdateWorker = worker;
      updateAvailable = true;
      render();
    }

    function updateAppNow() {
      if (!pendingUpdateWorker) {
        window.location.reload();
        return;
      }
      pendingUpdateWorker.postMessage({ type: "SKIP_WAITING" });
    }

    function adMedia(ad) {
      const src = ad?.mediaUrl || ad?.mediaData || "";
      if (!src) return `<div class="ad-media ad-placeholder" aria-hidden="true"></div>`;
      if (String(ad.mediaType || "").startsWith("video/")) {
        return `<div class="ad-media"><video class="ad-media-main" src="${esc(src)}" muted autoplay loop playsinline preload="metadata"></video></div>`;
      }
      return `<div class="ad-media"><img class="ad-media-main" src="${esc(src)}" alt="${esc(ad.title || "Pauta")}"></div>`;
    }

    function renderAdBanner() {
      const ad = state.activeAd || null;
      const title = ad?.title || "Tu publicidad aqui";
      const subtitle = ad?.body || ad?.advertiser || "Pauta visible en todas las ventanas de Link.";
      adBanner.innerHTML = `
        ${adMedia(ad)}
        <div class="ad-copy"><strong>${esc(title)}</strong><span>${esc(subtitle)}</span></div>
        <div class="ad-actions">
          ${ad?.targetUrl ? `<a class="mini-btn" href="${esc(ad.targetUrl)}" target="_blank" rel="noopener noreferrer">Ver oferta</a>` : ""}
          <button class="secondary" data-open-ad-request="1" type="button">Pautar aqui</button>
        </div>`;
    }

    function renderHeader() {
      const verified = state.officialNewsUpdatedAt ? `Fuentes verificadas ${dateTimeLabel(state.officialNewsUpdatedAt)}` : "Consultando fuentes oficiales";
      const current = user();
      const actions = current
        ? `<div class="header-actions"><button class="header-action" data-auth-shortcut="account" type="button">${esc(current.displayName || "Cuenta")}</button></div>`
        : `<div class="header-actions">
            <button class="header-action" data-auth-shortcut="register" type="button">REGISTRARSE</button>
            <button class="header-action secondary-action" data-auth-shortcut="login" type="button">INGRESAR</button>
          </div>`;
      headerBrand.innerHTML = `${updateNotice()}<div class="brand-row">
        ${logoImg("brand-mark")}
        <div class="brand-copy"><p>Link</p><strong>Link</strong><span>${esc(verified)}</span></div>
        ${actions}
      </div>`;
    }

    function menuItems() {
      const items = [...mainTabs];
      if (isAdmin()) items.push({ key: "admin", label: "Admin" });
      return items;
    }

    function tabIcon(key) {
      const icons = {
        inicio: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19a1 1 0 0 1 1 1v14.5A2.5 2.5 0 0 1 17.5 21H6.75A2.75 2.75 0 0 1 4 18.25V5.5Zm3 1v9h10v-9H7Zm0 11.25a.75.75 0 0 0 .75.75H17.5a1 1 0 0 0 1-1H7.75a.75.75 0 0 0-.75.75Z"/></svg>`,
        empleos: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4h6a2 2 0 0 1 2 2v2h2.5A1.5 1.5 0 0 1 21 9.5v8A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-8A1.5 1.5 0 0 1 4.5 8H7V6a2 2 0 0 1 2-2Zm0 4h6V6H9v2Zm3 7.5a3.5 3.5 0 0 0 3.35-2.5h3.15v4.5a.5.5 0 0 1-.5.5H6a.5.5 0 0 1-.5-.5V13h3.15A3.5 3.5 0 0 0 12 15.5Z"/></svg>`,
        marketplace: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4h10l2 4v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8l2-4Zm.25 6A3.25 3.25 0 0 0 12 12.87A3.25 3.25 0 0 0 16.75 10H17v8H7v-8h.25ZM8.2 6l-.75 2H11V6H8.2Zm4.8 0v2h3.55l-.75-2H13Z"/></svg>`,
        mensajes: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v7A2.5 2.5 0 0 1 17.5 15H10l-4.4 4.15A1 1 0 0 1 4 18.42V5.5Zm4 2.25a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H8Zm0 4a1 1 0 1 0 0 2h5.5a1 1 0 1 0 0-2H8Z"/></svg>`,
        cuenta: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Zm0 2c-4.1 0-7.5 2.05-7.5 4.6 0 .77.63 1.4 1.4 1.4h12.2c.77 0 1.4-.63 1.4-1.4 0-2.55-3.4-4.6-7.5-4.6Z"/></svg>`,
        admin: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 5 5v5.4c0 4.25 2.98 8.22 7 9.6 4.02-1.38 7-5.35 7-9.6V5l-7-3Zm1 5v4.2l3.25 1.95-1 1.64L11 12.25V7h2Z"/></svg>`,

    function renderTabs() {
      if (active === "admin" && !isAdmin()) active = "inicio";
      nav.innerHTML = `${menuItems().map((tab) => `
        <button class="menu-btn ${active === tab.key ? "active" : ""}" data-tab="${tab.key}" type="button">
          <span class="menu-icon">${tabIcon(tab.key)}</span><span>${esc(tab.label)}</span>
        </button>`).join("")}
        <button class="menu-btn download-menu" data-install="1" type="button">
          <span class="menu-icon">${tabIcon("descargar")}</span><span>Descargar</span>
        </button>`;
      nav.querySelectorAll("[data-tab]").forEach((button) => {
        button.onclick = () => {
          navigateTab(button.dataset.tab);
        };
      });
      nav.querySelector("[data-install]").onclick = installApp;
    }

    async function installApp() {
      if (installPromptEvent) {
        installPromptEvent.prompt();
        await installPromptEvent.userChoice.catch(() => {});
        installPromptEvent = null;
        installMessage = "Si aceptaste, Link quedo agregada al celular como app.";
        render();
        return;
      }
      installMessage = /iphone|ipad|ipod/i.test(navigator.userAgent)
        ? "En iPhone abre Link en Safari, toca Compartir y luego Agregar a pantalla de inicio."
        : "Si no aparece el instalador, abre el menu del navegador y elige Instalar app o Agregar a pantalla principal.";
      render();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
        reader.readAsDataURL(file);
      });
    }

    function optimizeImageFile(file, maxSide = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, maxSide / Math.max(img.width || maxSide, img.height || maxSide));
          const width = Math.max(1, Math.round((img.width || maxSide) * scale));
          const height = Math.max(1, Math.round((img.height || maxSide) * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            if (!blob) {
              reject(new Error("No se pudo preparar la foto"));
              return;
            }
            resolve(new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" }));
          }, "image/jpeg", quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("No se pudo leer la foto seleccionada"));
        };
        img.src = url;
      });
    }

    function fileName(file) {
      return String(file?.name || "").toLowerCase();
    }

    function fileMime(file, fallback = "application/octet-stream") {
      return String(file?.type || fallback);
    }

    function isImageFile(file) {
      return fileMime(file, "").startsWith("image/") || /\.(jpe?g|png|webp|gif|svg)$/i.test(fileName(file));
    }

    function isVideoFile(file) {
      return fileMime(file, "").startsWith("video/") || /\.(mp4|mov|webm)$/i.test(fileName(file));
    }

    function isDocumentFile(file) {
      return /(\.pdf|\.doc|\.docx)$/i.test(fileName(file)) || /application\/(pdf|msword|vnd\.openxmlformats-officedocument\.wordprocessingml\.document)/i.test(fileMime(file, ""));
    }

    function videoMetadata(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        const url = URL.createObjectURL(file);
        video.preload = "metadata";
        video.onloadedmetadata = () => {
          URL.revokeObjectURL(url);
          resolve({
            duration: Number.isFinite(video.duration) ? video.duration : 0,
            width: video.videoWidth || 0,
            height: video.videoHeight || 0,
          });
        };
        video.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("No se pudo validar el video"));
        };
        video.src = url;
      });
    }

    async function videoDuration(file) {
      const metadata = await videoMetadata(file);
      return metadata.duration || 0;
    }

    async function payloadFromForm(form) {
      const payload = {};
      const formData = new FormData(form);
      for (const [key, value] of formData.entries()) {
        if (value instanceof File) {
          if (!value.name || value.size === 0) continue;
          if (key === "photoFile") {
            if (!isImageFile(value)) throw new Error("La foto debe ser una imagen");
            if (value.size > 8_000_000) throw new Error("La foto debe pesar menos de 8 MB");
            let imageFile = value;
            if (!/image\/(?:gif|svg\+xml)/i.test(fileMime(value, ""))) {
              try {
                imageFile = await optimizeImageFile(value, 900, 0.82);
              } catch {}
            }
            if (imageFile.size > 2_800_000) throw new Error("La foto sigue muy pesada. Use una foto mas liviana");
            payload.photoData = await fileToDataUrl(imageFile);
          } else if (key === "attachmentFile") {
            if (!isDocumentFile(value)) throw new Error("El anexo debe ser PDF o Word");
            if (value.size > 8_000_000) throw new Error("El anexo debe pesar menos de 8 MB");
            payload.attachmentName = value.name;
            payload.attachmentData = await fileToDataUrl(value);
          } else if (key === "mediaFile") {
            if (isVideoFile(value)) {
              if (value.size > 12_000_000) throw new Error("El video debe pesar menos de 12 MB");
              const duration = await videoDuration(value);
              if (duration > 20.25) throw new Error("El video no puede superar 20 segundos");
              payload.mediaName = value.name;
              payload.mediaType = fileMime(value, /\.(mov)$/i.test(fileName(value)) ? "video/quicktime" : "video/mp4");
              payload.mediaData = await fileToDataUrl(value);
            } else if (isImageFile(value)) {
              if (value.size > 14_000_000) throw new Error("La foto debe pesar menos de 14 MB");
              const imageFile = /image\/(?:gif|svg\+xml)/i.test(fileMime(value, "")) ? value : await optimizeImageFile(value);
              if (imageFile.size > 3_500_000) throw new Error("La foto sigue muy pesada. Use una foto mas liviana");
              payload.mediaName = imageFile.name;
              payload.mediaType = fileMime(imageFile, "image/jpeg");
              payload.mediaData = await fileToDataUrl(imageFile);
            } else {
              throw new Error("Solo se permiten fotos o videos");
            }
          } else if (key === "adMediaFile") {
            if (isVideoFile(value)) {
              if (value.size > 18_000_000) throw new Error("El video de pauta debe pesar menos de 18 MB para cargar bien en celular");
              payload.mediaName = value.name;
              payload.mediaType = fileMime(value, /\.(mov)$/i.test(fileName(value)) ? "video/quicktime" : "video/mp4");
              payload.mediaData = await fileToDataUrl(value);
            } else if (isImageFile(value)) {
              if (value.size > 10_000_000) throw new Error("La imagen de pauta debe pesar menos de 10 MB");
              const imageFile = /image\/(?:gif|svg\+xml)/i.test(fileMime(value, "")) ? value : await optimizeImageFile(value, 1200, 0.82);
              if (imageFile.size > 2_800_000) throw new Error("La imagen de pauta sigue muy pesada. Use una mas liviana");
              payload.mediaName = imageFile.name;
              payload.mediaType = fileMime(imageFile, "image/jpeg");
              payload.mediaData = await fileToDataUrl(imageFile);
            } else {
              throw new Error("Solo se permiten imagenes o videos de pauta");
            }
          }
        } else {
          payload[key] = value;
        }
      }
      return payload;
    }

        button.onclick = () => {
          const action = button.dataset.bolsaAction;
          if (action === "browse") {
            bolsaAction = "";
            render();
            return;
          }
          if (!user()) {
            confirmRegistration("empleos");
            return;
          }
          bolsaAction = action;
          render();
        };
      });
      document.querySelectorAll("[data-resume-filter]").forEach((button) => {
        button.onclick = () => {
          activeResumeCategory = button.dataset.resumeFilter || "Todos";
          expandedResumeId = "";
          render();
        };
      });
      document.querySelectorAll("[data-resume-detail]").forEach((button) => {
        button.onclick = () => {
          const id = button.dataset.resumeDetail || "";
          expandedResumeId = expandedResumeId === id ? "" : id;
          render();
        };
      });
      document.querySelectorAll("[data-product-filter]").forEach((button) => {
        button.onclick = () => {
          activeProductCategory = button.dataset.productFilter || "Todos";
          render();
        };
      });
      document.querySelectorAll("[data-market-open]").forEach((button) => {
        button.onclick = () => {
          if (!user()) {
            confirmRegistration("marketplace");
            return;
          }
          mercadoEditorOpen = true;
          render();
        };
      });
      document.querySelectorAll("form[data-action='/api/products']").forEach((form) => {
        syncMarketFields(form);
        const select = form.querySelector("[data-market-type]");
        if (select) select.onchange = () => syncMarketFields(form);
      });
      document.querySelectorAll("form[data-auth='register']").forEach((form) => {
        syncAccountTypeFields(form);
        const select = form.querySelector("[data-account-type]");
        if (select) select.onchange = () => syncAccountTypeFields(form);
      });
      document.querySelectorAll(".file-field input[type='file']").forEach((input) => {
        const status = input.closest(".file-field")?.querySelector("[data-file-status]");
        if (!status) return;
        input.onchange = () => {
          const file = input.files?.[0];
          status.textContent = file ? `Archivo seleccionado: ${file.name}` : status.dataset.defaultText || "Seleccione un archivo.";
        };
        status.dataset.defaultText = status.textContent;
      });
      const refreshButton = document.querySelector("#refreshOfficialButton");
      if (refreshButton) refreshButton.onclick = refreshOfficialNews;
      const logoutButton = document.querySelector("#logoutButton");
      if (logoutButton) logoutButton.onclick = logout;
      document.querySelectorAll("form[data-auth]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await submitWithPayload(form, "Procesando...", "Validando datos...", (payload) => auth(form.dataset.auth, payload));
        };
      });
      document.querySelectorAll("form[data-action]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          const isProduct = form.dataset.action === "/api/products";
          const hasAdMedia = form.dataset.action === "/api/ad-requests" || form.dataset.action === "/api/admin/ad-campaigns";
          await submitWithPayload(
            form,
            isProduct || hasAdMedia ? "Preparando foto o video..." : "Procesando...",
            "Guardando...",
            (payload) => save(form.dataset.action, payload, { keepNotice: isProduct || hasAdMedia }),
          );
        };
      });
      document.querySelectorAll("form[data-message]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await submitWithPayload(form, "Procesando...", "Guardando...", (payload) => save(`/api/threads/${form.dataset.message}/messages`, payload));
        };
      });
      document.querySelectorAll("form[data-admin-settings]").forEach((form) => {
        const fileInput = form.querySelector('input[name="logoFile"]');
        const status = form.querySelector("[data-logo-status]");
        if (fileInput && status) {
          fileInput.onchange = () => {
            const file = fileInput.files?.[0];
            status.textContent = file ? `Archivo seleccionado: ${file.name}` : "Seleccione el logo que desea guardar.";
          };
        }
        form.onsubmit = async (event) => {
          event.preventDefault();
          await saveAdminSettings(form);
        };
      });
      document.querySelectorAll("form[data-admin-token-settings]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await saveAdminTokenSettings(form);
        };
      });
      document.querySelectorAll("form[data-admin-token-load]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          await loadCompanyTokens(form);
        };
      });
      document.querySelectorAll("[data-admin-action]").forEach((button) => {
        button.onclick = () => moderate(button.dataset.type, button.dataset.id, button.dataset.adminAction);
      });
      document.querySelectorAll("[data-ad-request-action]").forEach((button) => {
        button.onclick = () => moderateAdRequest(button.dataset.id, button.dataset.adRequestAction);
      });
      document.querySelectorAll("[data-user-action]").forEach((button) => {
        button.onclick = () => moderateUser(button.dataset.id, button.dataset.userAction);
      });
      document.querySelectorAll("[data-recovery-action]").forEach((button) => {
        button.onclick = () => moderateRecovery(button.dataset.id, button.dataset.recoveryAction);
      });
      document.querySelectorAll(".thread[data-thread]").forEach((button) => {
        button.onclick = () => {
          activeThreadId = button.dataset.thread;
          render();
        };
      });
    }

    function clearError() {
      const global = document.querySelector("#globalError");
      if (global) {
        global.textContent = "";
        global.classList.remove("show");
      }
      const box = document.querySelector("#formError");
      if (box) {
        box.textContent = "";
        box.classList.remove("show");
      }
      const notice = document.querySelector("#globalNotice");
      if (notice) {
        notice.textContent = "";
        notice.classList.remove("show");
      }
    }

    function showNotice(message) {
      const notice = document.querySelector("#globalNotice");
      if (!notice) return;
      notice.textContent = message;
      notice.classList.add("show");
    }

    function showError(error) {
      const message = error?.message || "No se pudo completar la accion";
      const box = document.querySelector("#formError");
      if (box) {
        box.textContent = message;
        box.classList.add("show");
        box.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      const global = document.querySelector("#globalError");
      if (global) {
        global.textContent = message;
        global.classList.add("show");
      }
    }

    async function submitWithPayload(form, preparingText, savingText, handler) {
      const button = form.querySelector('button[type="submit"]');
      const originalText = button?.textContent || "";
      try {
        clearError();
        if (button) {
          button.disabled = true;
          button.textContent = preparingText;
        }
        showNotice(preparingText);
        const payload = await payloadFromForm(form);
        if (button) button.textContent = savingText;
        showNotice(savingText);
        await handler(payload);
      } catch (error) {
        showError(error);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    function normalizeAuthPayload(kind, payload) {
      const next = { ...payload };
      if (kind === "register") {
        next.email = next.registerEmail || "";
        next.password = next.registerPassword || "";
        delete next.registerEmail;
        delete next.registerPassword;
      }
      if (kind === "login") {
        next.email = next.loginEmail || "";
        next.password = next.loginPassword || "";
        delete next.loginEmail;
        delete next.loginPassword;
      }
      if (kind === "recover") {
        next.email = next.recoverEmail || "";
        next.password = next.recoverPassword || "";
        delete next.recoverEmail;
        delete next.recoverPassword;
      }
      return next;
    }

    async function auth(kind, payload) {
      try {
        clearError();
        payload = normalizeAuthPayload(kind, payload);
        const authPaths = {
          register: "/api/auth/register",
          login: "/api/auth/login",
          recover: "/api/auth/recover",
          change: "/api/auth/change-password",
        };
        const endpoint = kind === "recover" && payload.recoveryCode
          ? "/api/auth/admin-recover"
          : authPaths[kind] || "/api/auth/login";
        const data = await api.post(endpoint, payload);
        if (kind === "recover") {
          if (data.token) {
            sessionToken = data.token;
            localStorage.setItem(authKey, sessionToken);
            accountMessage = data.message || "Clave actualizada.";
            applyState(await api.state());
            adminState = null;
            active = "admin";
            render();
            return;
          }
          accountMessage = data.message || "Solicitud enviada. El administrador debe aprobar el cambio de clave.";
          authMode = "login";
          render();
          return;
        }
        if (kind === "change") {
          accountMessage = data.message || "Clave actualizada correctamente.";
          render();
          showNotice(accountMessage);
          return;
        }
        sessionToken = data.token;
        localStorage.setItem(authKey, sessionToken);
        accountMessage = "";
        applyState(await api.state());
        adminState = null;
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function logout() {
      const previousToken = sessionToken;
      sessionToken = "";
      localStorage.removeItem(authKey);
      adminState = null;
      authMode = "login";
      accountMessage = "Sesion cerrada. Los formularios quedaron limpios.";
      active = "cuenta";
      applyState({ ...state, currentUser: null });
      render();
      showNotice(accountMessage);
      if (previousToken) {
        fetch("/api/auth/logout", {
          method: "POST",
          headers: { "content-type": "application/json", authorization: `Bearer ${previousToken}` },
          body: "{}",
        }).catch(() => {});
      }
      try {
        applyState(await api.state());
        render();
        showNotice(accountMessage);
      } catch {}
    }

    function saveSuccessMessage(path, result) {
      const pending = result?.status === "pending";
      if (path === "/api/products") return pending ? "Venta guardada. Queda pendiente de aprobacion por Admin." : "Venta publicada correctamente.";
      if (path === "/api/resumes") return pending ? "Hoja de vida guardada. Queda pendiente de aprobacion por Admin." : "Hoja de vida guardada y visible.";
      if (path === "/api/vacancies") return pending ? "Vacante guardada. Queda pendiente de aprobacion por Admin." : "Vacante publicada correctamente.";
      if (path === "/api/news") return pending ? "Informacion guardada. Queda pendiente de aprobacion por Admin." : "Informacion publicada correctamente.";
      if (path === "/api/ad-requests") return "Solicitud de pauta enviada. Admin la revisara para contactarte.";
      if (path === "/api/admin/ad-campaigns") return pending ? "Campana publicitaria guardada pendiente." : "Campana publicitaria publicada.";
      if (path === "/api/threads") return pending ? "Tema guardado. Queda pendiente de aprobacion por Admin." : "Tema publicado correctamente.";
      if (/^\/api\/threads\/[^/]+\/messages$/.test(path)) return "Respuesta guardada correctamente.";
      return pending ? "Guardado. Queda pendiente de aprobacion por Admin." : "Guardado correctamente.";
    }

    async function save(path, payload, options = {}) {
      try {
        if (!options.keepNotice) clearError();
        const result = await api.post(path, payload);
        applyState(await api.state());
        adminState = null;
        if (path === "/api/products") {
          mercadoEditorOpen = false;
        }
        if (path === "/api/ad-requests") {
          adRequestOpen = false;
        }
        if (path === "/api/resumes" || path === "/api/vacancies") bolsaAction = "";
        render();
        showNotice(saveSuccessMessage(path, result));
      } catch (error) {
        showError(error);
      }
    }

    async function downloadResumeCv(id) {
      if (!user()) {
        confirmRegistration("empleos", "login");
        return;
      }
      const popup = window.open("", "_blank");
      if (popup) {
        popup.document.write("<!doctype html><html lang=\"es\"><meta charset=\"utf-8\"><title>Link</title><body><p>Cargando hoja de vida...</p></body></html>");
        popup.document.close();
      }
      try {
        clearError();
        const data = await api.post(`/api/resumes/${encodeURIComponent(id)}/download`, {});
        if (!popup) throw new Error("El navegador bloqueo la ventana. Permite ventanas emergentes e intenta de nuevo.");
        popup.document.open();
        popup.document.write(data.html || "");
        popup.document.close();
        applyState(await api.state());
        render();
        showNotice(`Descarga autorizada. Saldo actual: ${tokensLabel(data.tokenBalance ?? user()?.tokenBalance)}`);
      } catch (error) {
        if (popup) popup.close();
        showError(error);
      }
    }

    async function refreshOfficialNews() {
      try {
        const button = document.querySelector("#refreshOfficialButton");
        if (button) button.textContent = "Verificando...";
        const official = await api.officialNews(true);
        applyState({
          ...state,
          officialNews: official.items || [],
          officialNewsUpdatedAt: official.updatedAt || null,
          officialNewsError: official.error || null,
          officialSources: official.sources || [],
        });
        render();
      } catch {
        applyState({ ...state, officialNewsError: "No se pudo verificar en este momento. Intenta de nuevo." });
        render();
      }
    }

    async function loadAdminState() {
      adminLoading = true;
      try {
        adminState = await api.get("/api/admin/state");
      } catch (error) {
        adminState = { error: error.message, users: [], content: {} };
      } finally {
        adminLoading = false;
        if (active === "admin") render();
      }
    }

    async function moderate(type, id, action) {
      try {
        await api.post("/api/admin/moderate", { type, id, action });
        adminState = await api.get("/api/admin/state");
        applyState(await api.state());
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function moderateUser(id, action) {
      try {
        const labels = { activate: "activar", deactivate: "dar de baja", delete: "eliminar" };
        if (!window.confirm(`Desea ${labels[action] || "modificar"} este usuario?`)) return;
        await api.post("/api/admin/users", { id, action });
        adminState = await api.get("/api/admin/state");
        applyState(await api.state());
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function moderateRecovery(id, action) {
      try {
        const labels = { approve: "aprobar la nueva clave", reject: "rechazar la solicitud", delete: "eliminar la solicitud" };
        if (!window.confirm(`Desea ${labels[action] || "procesar esta solicitud"}?`)) return;
        await api.post("/api/admin/recovery", { id, action });
        adminState = await api.get("/api/admin/state");
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function saveAdminSettings(form) {
      try {
        const formData = new FormData(form);
        const logoFile = formData.get("logoFile");
        const clearLogo = formData.get("clearLogo") === "on";
        const payload = { clearLogo };
        if (!clearLogo && (!(logoFile instanceof File) || !logoFile.name || logoFile.size === 0)) {
          throw new Error("Seleccione un archivo de logo antes de guardar");
        }
        if (logoFile instanceof File && logoFile.name) {
          if (logoFile.size > 10_000_000) throw new Error("El logo debe pesar menos de 10 MB");
          payload.logoData = await fileToDataUrl(logoFile);
          payload.logoType = logoFile.type;
          payload.logoName = logoFile.name;
        }
        const result = await api.post("/api/admin/settings", payload);
        applyState({ ...state, settings: result.settings || state.settings });
        adminState = await api.get("/api/admin/state");
        accountMessage = result.settings?.logoUrl || result.settings?.logoData
          ? `Logo actualizado: ${result.settings.logoName || "archivo guardado"}`
          : "Logo base restaurado.";
        render();
      } catch (error) {
        showError(error);
      }
    }

    async function saveAdminTokenSettings(form) {
      try {
        clearError();
        const payload = Object.fromEntries(new FormData(form).entries());
        const result = await api.post("/api/admin/token-settings", payload);
        applyState({ ...state, settings: result.settings || state.settings });
        adminState = await api.get("/api/admin/state");
        render();
        showNotice("Parametros de tokens guardados.");
      } catch (error) {
        showError(error);
      }
    }

    async function loadCompanyTokens(form) {
      try {
        clearError();
        const payload = Object.fromEntries(new FormData(form).entries());
        await api.post("/api/admin/tokens/load", payload);
        adminState = await api.get("/api/admin/state");
        applyState(await api.state());
        render();
        showNotice("Tokens cargados a la empresa.");
      } catch (error) {
        showError(error);
      }
    }

    async function moderateAdRequest(id, action) {
      try {
        await api.post("/api/admin/ad-requests", { id, action });
        adminState = await api.get("/api/admin/state");
        render();
      } catch (error) {
        showError(error);
      }
    }

    function render() {
      renderHeader();
      renderTabs();
      renderAdBanner();
      if (active === "inicio") content.innerHTML = renderInicio();
      if (active === "empleos") content.innerHTML = renderBolsa();
      if (active === "marketplace") content.innerHTML = renderMarketplace();
      if (active === "mensajes") content.innerHTML = renderMensajes();
      if (active === "cuenta") content.innerHTML = renderCuenta();
      if (active === "admin") content.innerHTML = renderAdmin();
      bindForms();
    }

    async function hydrateOfficialNews() {
      if (officialItems().length || state.officialNewsError) return;
      await refreshOfficialNews();
    }

    async function boot() {
      renderHeader();
      renderTabs();
      content.innerHTML = `<section class="screen splash">${logoImg("logo-hero")}<h1>Link</h1><p>Cargando publicaciones aprobadas.</p><div class="loader"></div></section>`;
      try {
        applyState(await api.state());
      } catch {
        applyState({
          ...baseState(),
          settings: state.settings,
          officialNewsError: "Backend no conectado. Abre la app desde el link publico de Render o desde localhost con el servidor activo.",
        });
      }
      render();
      hydrateOfficialNews();
    }

    applyBootstrapSettings();
    boot();
  </script>
</body>
</html>
